<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDM</title>
<style>
  :root { --line: #ddd; --muted: #777; --mine: #1d5fbf; --other: #b5651d; --newer: #6a6a6a; --new: #2e7d32; --bad: #b00020; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #222; background: #fafafa; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #fff; }
  header b { font-size: 14px; }
  header .who { margin-left: auto; color: var(--muted); }
  button { font: inherit; padding: 3px 10px; border: 1px solid #bbb; background: #fff; border-radius: 3px; cursor: pointer; }
  button:hover:not(:disabled) { background: #f0f0f0; }
  button:disabled { color: #aaa; cursor: default; }
  button.main { border-color: var(--mine); color: var(--mine); }
  input[type=text], input[type=email], input[type=password] { font: inherit; padding: 4px 6px; border: 1px solid #bbb; border-radius: 3px; width: 100%; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 1fr); height: calc(100vh - 41px); }
  section { overflow: auto; padding: 10px 14px; }
  section + section { border-left: 1px solid var(--line); background: #fff; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 6px; padding: 1px 4px; white-space: nowrap; border-radius: 2px; }
  .row.file { cursor: pointer; }
  .row.file:hover, .row.sel { background: #e8eef8; }
  .row.folder { cursor: pointer; color: #444; }
  .row.folder .tw { width: 12px; display: inline-block; color: var(--muted); }
  .row.file .dot { margin: 0 2px; } /* centred in the same 12px as a folder's arrow, so names line up */
  .name { overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; color: var(--muted); }
  .tag.mine { color: var(--mine); }
  .tag.other { color: var(--other); }
  .tag.newer { color: var(--newer); }
  .tag.bad { color: var(--bad); }
  .tag.new { color: var(--new); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: transparent; }
  .dot.mine { background: var(--mine); }
  .dot.other { background: var(--other); }
  .dot.newer { border: 1px solid var(--newer); }
  .dot.new { background: var(--new); }
  .row.off { color: #999; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .bar .grow { flex: 1; min-width: 160px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 6px 2px 0; vertical-align: top; }
  .muted { color: var(--muted); }
  .nw { white-space: nowrap; }
  #settingsBtn { font-size: 15px; line-height: 1; padding: 3px 7px; }
  pre { margin: 0; white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; color: #333; }
  #login { max-width: 300px; margin: 80px auto; display: grid; gap: 8px; }
  #login .err { color: var(--bad); min-height: 1.4em; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button.on, #settingsBtn.on { background: #e8eef8; border-color: var(--mine); }
  .tabs button.alert { color: var(--bad); border-color: var(--bad); }
  #settings { max-width: 300px; display: grid; gap: 8px; }
  #settings .err { color: var(--bad); }
  #result { margin: 0 0 10px; padding: 6px 8px; border-left: 3px solid var(--mine); background: #f3f6fb; }
  #result.bad { border-left-color: var(--bad); background: #fbf1f2; }
  #result.bad #resultText { color: var(--bad); }
  #result a { color: var(--muted); font-size: 12px; }
  #resultLines { margin-top: 6px; }
  #progress { display: block; width: 100%; height: 6px; margin-top: 6px; accent-color: var(--mine); }
</style>
</head>
<body>
<div id="login" hidden>
  <b>PDM</b>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <div id="newpw" hidden style="display:grid;gap:8px">
    <span class="muted">Choose a new password (8+ characters, with a lowercase letter and a number).</span>
    <input id="new1" type="password" placeholder="New password" autocomplete="new-password">
    <input id="new2" type="password" placeholder="New password again" autocomplete="new-password">
  </div>
  <button class="main" id="loginBtn">Log in</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <header>
    <b>PDM</b>
    <button id="refreshBtn" title="Shows the latest list from the vault. Downloads nothing.">Reload list</button>
    <button id="getBtn" title="Downloads every file that's newer in the vault than on this PC. Your checked-out files are left alone.">Download latest</button>
    <span class="who" id="who"></span>
    <button id="restartBtn" class="main" hidden title="Installs the new version of PDM and restarts it. Log in again afterwards."></button>
    <button id="settingsBtn" title="Settings: your account, the version, and change password.">⚙</button>
    <button id="logoutBtn" title="Logs you out of PDM on this PC. Your check-outs stay as they are.">Log out</button>
  </header>
  <main>
    <section>
      <div class="bar"><input type="text" class="grow" id="filter" placeholder="Filter"></div>
      <div id="tree"></div>
    </section>
    <section>
      <div class="tabs">
        <button id="tabOut" class="on">Check out</button>
        <button id="tabIn">Check in</button>
        <button id="tabWho">Who has what</button>
        <button id="tabNew">Changes</button>
      </div>
      <div id="result" hidden><span id="resultText"></span> <a href="#" id="resultMore">Details</a><pre id="resultLines" hidden></pre><progress id="progress" hidden></progress></div>
      <div id="panel"></div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let me = null, files = [], byId = {}, byPath = {}, selected = null, tab = 'out', lastTab = 'out', open = new Set(), busy = false, panelDirty = false;

async function api(path, body) {
  const r = await fetch('/api/' + path, {
    method: 'POST', headers: { 'X-PDM': '1', 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== 'login') { showLogin(); throw new Error('Logged out'); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function base(p) { return p.slice(p.lastIndexOf('/') + 1); }
function dir(p) { return p.slice(0, p.lastIndexOf('/') + 1); }
function when(t) {
  if (!t) return '';
  const d = new Date(t);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function isAsm(p) { return /\.sldasm$/i.test(p); }
// Who holds a file someone else has; my own check-out on another PC says which PC.
function holder(f) { return f.lockedByName === me.name ? 'you on ' + f.lockMachine : f.lockedByName + ' on ' + f.lockMachine; }

function status(f) {
  if (f.isNew) return { cls: 'new', text: 'new, not in the vault' };
  if (f.mine) return { cls: 'mine', text: f.changed ? 'checked out, changed' : 'checked out' };
  if (f.lockedByName) return { cls: 'other', text: holder(f) + ', since ' + when(f.lockedAt) };
  if (f.newer) return { cls: 'newer', text: 'newer in vault' };
  return { cls: '', text: '' };
}

// ---- login
function showLogin() { me = null; $('app').hidden = true; $('login').hidden = false; $('email').focus(); }
async function login() {
  $('loginErr').textContent = '';
  const body = { email: $('email').value.trim(), password: $('password').value };
  if (!$('newpw').hidden) {
    if ($('new1').value !== $('new2').value) { $('loginErr').textContent = "New passwords don't match."; return; }
    body.newPassword = $('new1').value;
  }
  $('loginBtn').disabled = true;
  try {
    const r = await api('login', body);
    if (r.newPasswordNeeded) { $('newpw').hidden = false; $('new1').focus(); return; }
    me = r; $('password').value = $('new1').value = $('new2').value = ''; $('newpw').hidden = true;
    $('login').hidden = true; $('app').hidden = false;
    showMe();
  } catch (e) { $('loginErr').textContent = e.message; return; }
  finally { $('loginBtn').disabled = false; }
  // Logged in: a failure from here on shows on the page, not on the hidden login form.
  try {
    await load();
    if (me.updatedTo) showResult(['Updated to v' + me.updatedTo + '.'], true);
  } catch (e) { showResult(["Can't list files: " + e.message]); }
}

// ---- data
// fromTimer: the 30 s refresh, which leaves the right panel alone once it's been typed or ticked in.
async function load(fromTimer) {
  files = await api('files');
  byId = {}; byPath = {};
  for (const f of files) { byId[f.id] = f; byPath[f.path] = f; }
  if (selected && !byPath[selected]) selected = null;
  if (open.size === 0) for (const f of files) { const parts = f.path.split('/'); for (let i = 1; i < Math.min(parts.length, 3); i++) open.add(parts.slice(0, i).join('/') + '/'); }
  drawTree(); drawTabs();
  if (!fromTimer || !panelDirty) drawPanel();
}

// ---- the result line: one summary under the tabs, problems first, the full list behind Details
const done = [['Checked out ', 'Checked out'], ['Checked in ', 'Checked in'], ['Added ', 'Added'], ['No changes in ', 'Released (no changes)'], ['Undone ', 'Undone'], ['Got ', 'Downloaded']];
// fraction (0..1) shows the progress bar while working.
function showResult(lines, working, fraction) {
  const kind = l => done.find(([p]) => l.startsWith(p));
  const problems = working ? [] : lines.filter(l => !kind(l) && !l.startsWith('Get done') && !l.startsWith('  Note') && !l.startsWith('  Time'));
  const parts = [];
  if (problems.length) parts.push(problems.length === 1 ? problems[0] : problems.length + ' problems');
  for (const [p, label] of done) {
    const n = lines.filter(l => l.startsWith(p)).length;
    if (n) parts.push(label + ' ' + n + ' file' + (n === 1 ? '' : 's'));
  }
  if (lines.some(l => l.startsWith('Get done')) && !lines.some(l => l.startsWith('Got '))) parts.push('Up to date');
  const notes = lines.filter(l => l.startsWith('  Note')).length;
  if (notes) parts.push(notes + ' note' + (notes === 1 ? '' : 's') + ': see Details');
  $('result').hidden = false;
  $('result').classList.toggle('bad', problems.length > 0);
  $('resultText').textContent = working ? lines[0] : (parts.join(' · ') || 'Done.');
  $('resultLines').textContent = [...problems, ...lines.filter(l => !problems.includes(l))].join('\n');
  $('resultLines').hidden = true; $('resultMore').textContent = 'Details';
  $('resultMore').hidden = working || (lines.length < 2 && problems.length < 2);
  $('progress').hidden = fraction === undefined;
  if (fraction !== undefined) $('progress').value = fraction;
}
function hideResult() { if (!busy) $('result').hidden = true; }

async function run(path, body) {
  if (busy) return;
  busy = true; document.querySelectorAll('button').forEach(b => b.disabled = true);
  showResult(['Working…'], true);
  try {
    const r = await api(path, body);
    showResult(r.log || []);
  } catch (e) { showResult(['Error: ' + e.message]); }
  await load().catch(() => {}); // still busy, so nothing acts on the old list
  busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false);
}

// A few files per request so the page can show progress. Each step is { path, paths, body, verb };
// the replies are gathered into the usual summary. plan: the steps, or a function that works them out.
async function runSteps(plan) {
  if (busy) return;
  busy = true; document.querySelectorAll('button').forEach(b => b.disabled = true);
  showResult(['Working…'], true);
  const steps = typeof plan === 'function' ? await plan().catch(() => []) : plan;
  const log = [], total = steps.reduce((n, s) => n + s.paths.length, 0), time = {}, started = Date.now();
  const run = String(started); // the app reads the vault's index once per run, not once per request
  let n = 0;
  for (const s of steps) {
    const what = s.paths.length === 1 ? base(s.paths[0]) : s.paths.length + ' files';
    showResult([`${s.verb} ${what} (${n + s.paths.length} of ${total})…`], true, n / total);
    try {
      const r = await api(s.path, { ...s.body, paths: s.paths, run });
      log.push(...(r.log || []));
      for (const [k, v] of Object.entries(r.timing || {})) time[k] = (time[k] || 0) + v;
    }
    catch (e) { log.push('Error: ' + e.message); if (!me) break; } // logged out: stop
    n += s.paths.length;
  }
  // Each get reports its own "Get done" line; one is enough.
  const gets = log.filter(l => l.startsWith('Get done'));
  showResult([...log.filter(l => !l.startsWith('Get done')), ...(gets.length ? ['Get done.'] : []), timeLine(Date.now() - started, time)]);
  await load().catch(() => {}); // still busy, so nothing acts on the old list
  busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false);
}
// Where the time went, under Details: "  Time: 95 s in all; uploads 40 s, Document Manager 30 s, ...".
function timeLine(ms, time) {
  const s = x => x >= 90 ? Math.floor(x / 60) + ' min ' + Math.round(x % 60) + ' s' : (x < 10 ? x.toFixed(1) : Math.round(x)) + ' s';
  const parts = Object.entries(time).filter(([, v]) => v >= 0.05).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + s(v));
  return '  Time: ' + s(ms / 1000) + ' in all' + (parts.length ? '; ' + parts.join(', ') + ' (work done several at a time can add up to more)' : '') + '.';
}
function chunks(list, size) { const out = []; for (let i = 0; i < list.length; i += size) out.push(list.slice(i, i + size)); return out; }
const steps = (path, paths, size, verb, body) => chunks(paths, size).map(p => ({ path, paths: p, verb, body }));

// Download latest: what's newer one file at a time, then one quick pass over the rest
// (sets them read-only, and flags files changed here without a check-out).
function getLatest() {
  runSteps(async () => {
    await load(); // what's newer right now
    const vault = files.filter(f => !f.isNew && !f.mine);
    const newer = vault.filter(f => f.newer).map(f => f.path), rest = vault.filter(f => !f.newer).map(f => f.path);
    return [...steps('get', newer, 1, 'Getting'), ...steps('get', rest, rest.length || 1, 'Checking')];
  });
}
// Parts before assemblies before drawings, so a new part is in the index before what uses it.
const rank = p => /\.sldprt$/i.test(p) ? 0 : /\.sldasm$/i.test(p) ? 1 : 2;

// ---- left: the folder tree
function drawTree() {
  const q = $('filter').value.trim().toLowerCase();
  const shown = files.filter(f => !q || f.path.toLowerCase().includes(q));
  const root = { dirs: {}, files: [] };
  for (const f of shown) {
    const parts = f.path.split('/'); let n = root;
    for (const p of parts.slice(0, -1)) n = n.dirs[p] ??= { dirs: {}, files: [] };
    n.files.push(f);
  }
  const out = [];
  (function walk(n, prefix, depth) {
    for (const name of Object.keys(n.dirs).sort((a, b) => a.localeCompare(b))) {
      const key = prefix + name + '/', isOpen = q || open.has(key);
      const mineHere = files.some(f => f.mine && f.path.startsWith(key)), otherHere = files.some(f => f.lockedByName && !f.mine && f.path.startsWith(key));
      const newHere = files.some(f => f.isNew && f.path.startsWith(key));
      out.push(`<div class="row folder" style="padding-left:${depth * 14 + 4}px" data-dir="${esc(key)}"><span class="tw">${isOpen ? '▾' : '▸'}</span>${esc(name)}`
        + (mineHere ? ' <span class="dot mine"></span>' : '') + (otherHere ? ' <span class="dot other"></span>' : '') + (newHere ? ' <span class="dot new"></span>' : '') + '</div>');
      if (isOpen) walk(n.dirs[name], key, depth + 1);
    }
    for (const f of n.files.sort((a, b) => a.path.localeCompare(b.path))) {
      const st = status(f);
      out.push(`<div class="row file${selected === f.path ? ' sel' : ''}" style="padding-left:${depth * 14 + 4}px" data-path="${esc(f.path)}">`
        + `<span class="dot ${st.cls}"></span><span class="name">${esc(base(f.path))}</span><span class="tag ${st.cls}">${esc(st.text)}</span></div>`);
    }
  })(root, '', 0);
  $('tree').innerHTML = out.join('') || '<span class="muted">No files.</span>';
}

$('tree').addEventListener('click', e => {
  const d = e.target.closest('[data-dir]'), f = e.target.closest('[data-path]');
  if (d) {
    if (e.detail > 1) return;
    const k = d.dataset.dir;
    open.has(k) ? open.delete(k) : open.add(k); drawTree();
  } else if (f) { selected = f.dataset.path; drawTree(); drawPanel(); }
});
$('tree').addEventListener('dblclick', e => {
  const d = e.target.closest('[data-dir]');
  if (d) { selected = d.dataset.dir; tab = 'out'; drawTabs(); drawTree(); drawPanel(); }
});

// ---- right: check out
// Everything an assembly uses, depth first, each file once.
function descendants(f) {
  const seen = new Set([f.id]), list = [];
  (function walk(x, depth) {
    for (const id of x.refs) {
      const c = byId[id];
      if (!c || seen.has(id)) continue;
      seen.add(id); list.push({ f: c, depth }); walk(c, depth + 1);
    }
  })(f, 1);
  return list;
}

// A model's drawing is the one with the same name (08A11-HBA-01.SLDDRW for 08A11-HBA-01.SLDASM).
// Other drawings that show the model (e.g. the whole station's) don't come with it.
const stem = p => base(p).replace(/\.[^.]*$/, '').toLowerCase();
function drawingOf(f) {
  if (/\.slddrw$/i.test(f.path)) return null;
  return f.usedBy.map(id => byId[id]).find(d => d && /\.slddrw$/i.test(d.path) && stem(d.path) === stem(f.path)) || null;
}

// What the check-out list shows: a folder's files, or a file with everything it uses and their drawings.
function outRows() {
  if (!selected) return null;
  if (selected.endsWith('/')) return { title: 'Folder ' + selected, folder: selected, rows: files.filter(f => f.path.startsWith(selected)).map(f => ({ f, depth: 0 })) };
  const top = byPath[selected];
  if (!top) return null;
  const models = [{ f: top, depth: 0 }, ...(isAsm(top.path) ? descendants(top) : [])], seen = new Set(models.map(r => r.f.id)), rows = [];
  for (const r of models) {
    rows.push(r);
    const d = drawingOf(r.f);
    if (d && !seen.has(d.id)) { seen.add(d.id); rows.push({ f: d, depth: r.depth }); }
  }
  return { title: base(top.path), folder: dir(top.path), file: true, rows };
}

function drawOut() {
  const v = outRows();
  if (!v) return '<span class="muted">Pick an assembly or file on the left. Double-click a folder to check out the folder.</span>';
  const inView = new Set(v.rows.map(r => r.f.id));
  const rows = v.rows.map(({ f, depth }) => {
    const other = f.lockedByName && !f.mine;
    const canShared = !f.shared || me.sharedEditor;
    const disabled = other || f.mine || !canShared || f.isNew;
    const ticked = !disabled && !f.shared && f.path.startsWith(v.folder);
    let note = '';
    if (f.isNew) note = '<span class="tag new">new: add it from Check in</span>';
    else if (f.mine) note = '<span class="tag mine">yours</span>';
    else if (other) note = `<span class="tag other">${esc(holder(f))}, since ${esc(when(f.lockedAt))}</span>`;
    else if (f.shared) {
      const n = f.usedBy.filter(id => !inView.has(id) && byId[id] && isAsm(byId[id].path)).length;
      note = `<span class="tag">shared${n ? ', used by ' + n + ' other assembl' + (n === 1 ? 'y' : 'ies') : ''}${canShared ? '' : ', read-only'}</span>`;
    }
    if (f.newer && !f.mine && !other) note += ' <span class="tag newer">newer in vault</span>';
    return `<div class="row${disabled ? ' off' : ''}" style="padding-left:${depth * 16 + 4}px" title="${esc(f.path)}">`
      + `<input type="checkbox" data-out="${esc(f.path)}"${ticked ? ' checked' : ''}${disabled ? ' disabled' : ''}>`
      + `<span class="name">${esc(base(f.path))}</span>${note}</div>`;
  }).join('');
  return `<h2>${esc(v.title)}</h2><div class="bar"><button class="main" id="outBtn">Check out ticked</button>`
    + `<label class="nw"><input type="checkbox" data-all="out"> Tick all</label><span class="muted" id="outCount"></span></div>${rows}`;
}

// ---- right: check in
function drawIn() {
  const mine = files.filter(f => f.mine || f.isNew);
  if (mine.length === 0) return '<span class="muted">Nothing checked out, and no new files.</span>';
  const v = outRows(), under = v ? new Set(v.rows.map(r => r.f.path)) : null;
  const rows = mine.map(f => {
    // A new file is added by check-in; in a shared folder only shared editors can add it.
    const canAdd = !f.isNew || !f.shared || me.sharedEditor;
    const ticked = canAdd && (!under || under.has(f.path) || (f.isNew && f.path.startsWith(v.folder)));
    const tag = f.isNew ? `<span class="tag new">new${canAdd ? '' : ', shared: only a shared editor can add it'}</span>`
      : `<span class="tag ${f.changed ? 'mine' : ''}">${f.changed ? 'changed' : 'no change'}</span>`;
    return `<div class="row${canAdd ? '' : ' off'}" title="${esc(f.path)}"><input type="checkbox" data-in="${esc(f.path)}"${ticked ? ' checked' : ''}${canAdd ? '' : ' disabled'}>`
      + `<span class="name">${esc(f.path)}</span>${tag}</div>`;
  }).join('');
  return `<h2>Checked out by me, and new files${v ? ' · ticked: under ' + esc(v.title) : ''}</h2>`
    + `<div class="bar"><input type="text" class="grow" id="note" placeholder="Note"><button class="main" id="inBtn">Check in ticked</button><button id="undoBtn">Undo ticked</button>`
    + `<label class="nw"><input type="checkbox" data-all="in"> Tick all</label></div>${rows}`;
}

// ---- right: who has what
function drawWho() {
  const held = files.filter(f => f.lockedByName).sort((a, b) => (a.lockedByName + a.path).localeCompare(b.lockedByName + b.path));
  if (held.length === 0) return '<span class="muted">Nothing is checked out.</span>';
  return '<table>' + held.map(f => `<tr><td class="${f.mine ? 'tag mine' : 'tag other'}">${esc(f.mine || f.lockedByName === me.name ? 'you' : f.lockedByName)}</td><td>${esc(f.path)}</td>`
    + `<td class="muted">${esc(when(f.lockedAt))}${f.lockMachine ? ' · ' + esc(f.lockMachine) : ''}</td></tr>`).join('') + '</table>';
}

// ---- right: changes others made in the vault since this PC last got them
function drawNew() {
  const newer = files.filter(f => f.newer).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  if (newer.length === 0) return '<span class="muted">Up to date: nothing newer in the vault.</span>';
  return `<h2>Newer in the vault than on this PC</h2><div class="bar"><button class="main" id="newGetBtn" title="Downloads every file that's newer in the vault than on this PC. Your checked-out files are left alone.">Download latest</button></div><table>` + newer.map(f => `<tr><td>${esc(f.path)}</td>`
    + `<td class="tag newer nw">${f.missing ? 'not on this PC' : 'updated'}</td><td class="muted nw">${esc(f.updatedBy)} · ${esc(when(f.updatedAt))}</td>`
    + `<td class="muted">${esc(f.note)}</td></tr>`).join('') + '</table>';
}

// ---- right: settings (from the cog)
function drawSettings() {
  return `<div id="settings"><h2>Settings</h2><span class="muted">${esc(me.email)} · v${esc(me.version)}</span>`
    + '<h2>Change password</h2><span class="muted">8+ characters, with a lowercase letter and a number.</span>'
    + '<input id="pwOld" type="password" placeholder="Current password" autocomplete="current-password">'
    + '<input id="pwNew1" type="password" placeholder="New password" autocomplete="new-password">'
    + '<input id="pwNew2" type="password" placeholder="New password again" autocomplete="new-password">'
    + '<div class="bar"><button class="main" id="pwBtn">Change password</button><button id="pwCancel">Cancel</button></div><div id="pwMsg"></div></div>';
}
async function changePassword() {
  const msg = (text, bad) => { $('pwMsg').textContent = text; $('pwMsg').className = bad ? 'err' : 'muted'; };
  if ($('pwNew1').value !== $('pwNew2').value) return msg("New passwords don't match.", true);
  if ($('pwNew1').value.length < 8) return msg('The new password needs 8 or more characters.', true);
  $('pwBtn').disabled = true;
  try {
    await api('password', { old: $('pwOld').value, new: $('pwNew1').value });
    $('pwOld').value = $('pwNew1').value = $('pwNew2').value = '';
    panelDirty = false;
    msg('Password changed.');
  } catch (e) { msg(e.message, true); }
  finally { $('pwBtn').disabled = false; }
}

// Tab labels carry counts; Check in turns red while I have changed files not yet checked in.
function drawTabs() {
  for (const [id, t] of [['tabOut', 'out'], ['tabIn', 'in'], ['tabWho', 'who'], ['tabNew', 'new']]) $(id).classList.toggle('on', tab === t);
  $('settingsBtn').classList.toggle('on', tab === 'settings');
  const changed = files.filter(f => f.mine && f.changed).length, newer = files.filter(f => f.newer).length;
  const added = files.filter(f => f.isNew && (!f.shared || me.sharedEditor)).length;
  const counts = [changed && changed + ' changed', added && added + ' new'].filter(Boolean).join(', ');
  $('tabIn').textContent = 'Check in' + (counts ? ` (${counts})` : '');
  $('tabIn').classList.toggle('alert', changed + added > 0);
  $('tabNew').textContent = 'Changes' + (newer ? ` (${newer})` : '');
}

function drawPanel() {
  $('panel').innerHTML = { out: drawOut, in: drawIn, who: drawWho, new: drawNew, settings: drawSettings }[tab]();
  panelDirty = false;
  // "Tick all" ticks or clears every row that can be ticked, and shows ticked / part-ticked as the rows change.
  const boxes = k => [...$('panel').querySelectorAll(`[data-${k}]:not(:disabled)`)];
  const sync = () => {
    for (const all of $('panel').querySelectorAll('[data-all]')) {
      const b = boxes(all.dataset.all), on = b.filter(c => c.checked).length;
      all.checked = b.length > 0 && on === b.length; all.indeterminate = on > 0 && on < b.length;
    }
    const c = $('outCount'); if (c) c.textContent = document.querySelectorAll('[data-out]:checked').length + ' ticked';
  };
  sync();
  $('panel').querySelectorAll('[data-out], [data-in]').forEach(c => c.addEventListener('change', sync));
  $('panel').querySelectorAll('[data-all]').forEach(all => all.addEventListener('change', () => { boxes(all.dataset.all).forEach(c => c.checked = all.checked); sync(); }));
  $('outBtn')?.addEventListener('click', () => {
    const paths = [...document.querySelectorAll('[data-out]:checked')].map(c => c.dataset.out);
    if (!paths.length) return;
    // Checking out a file also gets the latest of everything it uses (and their drawings), ticked or not.
    const v = outRows(), ticked = new Set(paths);
    const get = v?.file ? v.rows.filter(r => r.f.newer && !r.f.isNew && !ticked.has(r.f.path)).map(r => r.f.path) : [];
    runSteps([...steps('checkout', paths, 24, 'Checking out'), ...steps('get', get, 5, 'Getting')]);
  });
  $('inBtn')?.addEventListener('click', () => {
    const paths = [...document.querySelectorAll('[data-in]:checked')].map(c => c.dataset.in).sort((a, b) => rank(a) - rank(b));
    // Unchanged files are only released, so they all go in one request; changed and new ones one by one.
    const quick = paths.filter(p => byPath[p]?.mine && !byPath[p].changed), slow = paths.filter(p => !quick.includes(p));
    const body = { note: $('note').value.trim() };
    if (paths.length) runSteps([...steps('checkin', quick, quick.length || 1, 'Releasing unchanged:', body), ...steps('checkin', slow, 1, 'Checking in', body)]);
  });
  $('newGetBtn')?.addEventListener('click', getLatest);
  $('pwBtn')?.addEventListener('click', changePassword);
  $('pwCancel')?.addEventListener('click', () => { tab = lastTab; drawTabs(); drawPanel(); }); // back to where I was; the form is dropped
  $('undoBtn')?.addEventListener('click', () => {
    const paths = [...document.querySelectorAll('[data-in]:checked')].map(c => c.dataset.in).filter(p => !byPath[p]?.isNew);
    if (paths.length) run('undo', { paths });
  });
}

$('tabOut').onclick = () => { tab = 'out'; hideResult(); drawTabs(); drawPanel(); };
$('tabIn').onclick = () => { tab = 'in'; hideResult(); drawTabs(); drawPanel(); };
$('tabWho').onclick = () => { tab = 'who'; hideResult(); drawTabs(); drawPanel(); };
$('tabNew').onclick = () => { tab = 'new'; hideResult(); drawTabs(); drawPanel(); };
$('settingsBtn').onclick = () => { if (tab !== 'settings') lastTab = tab; tab = 'settings'; hideResult(); drawTabs(); drawPanel(); };
for (const ev of ['input', 'change']) $('panel').addEventListener(ev, () => { panelDirty = true; });
$('resultMore').onclick = e => { e.preventDefault(); const l = $('resultLines'); l.hidden = !l.hidden; $('resultMore').textContent = l.hidden ? 'Details' : 'Hide'; };
$('filter').oninput = drawTree;
$('getBtn').onclick = getLatest;
$('refreshBtn').onclick = () => load().catch(e => showResult(['Error: ' + e.message]));
$('logoutBtn').onclick = async () => { await api('logout').catch(() => {}); showLogin(); };
$('loginBtn').onclick = login;
for (const id of ['email', 'password', 'new1', 'new2']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// Keep locks current without a reload, so another PC's check-out shows up.
setInterval(() => {
  if (!me || busy || document.visibilityState !== 'visible') return;
  load(true).catch(() => {});
  api('me').then(r => { me = r; showMe(); }).catch(() => {});
}, 30000);

// Name, version, and an Update button once an update has downloaded (it restarts the app).
function showMe() {
  $('who').textContent = me.name + (me.sharedEditor ? ' · shared editor' : '') + ' · v' + me.version;
  $('restartBtn').hidden = !me.updateReady;
  $('restartBtn').textContent = 'Update to ' + me.updateReady;
}
$('restartBtn').onclick = async () => {
  if (busy) return;
  busy = true; showResult(['Updating to ' + me.updateReady + '…'], true);
  await api('restart').catch(() => {});
  // The app comes back on the same address in a few seconds; reload to log in again.
  setTimeout(function retry() { fetch('/').then(() => location.reload(), () => setTimeout(retry, 1000)); }, 3000);
};

api('me').then(r => { me = r; $('app').hidden = false; showMe(); return load().catch(e => showResult(["Can't list files: " + e.message])); })
  .catch(() => showLogin());
</script>
</body>
</html>
