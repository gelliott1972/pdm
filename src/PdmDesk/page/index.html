<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDM Desk</title>
<script>
// Light / dark / system, remembered on this PC; set before the page draws so it doesn't flash.
try { const t = localStorage.getItem('desk-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #1c2024; --muted: #646d78; --line: #e3e6ea;
  --accent: #2f6fde; --accent-ink: #ffffff; --accent-soft: #e8effc;
  --red: #c8372d; --red-soft: #fbeceb; --amber: #b7791f; --amber-soft: #fbf3e3;
  --green: #2f8a4c; --green-soft: #e7f4ec; --grey: #8a929c;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #1a1d22; --ink: #e7e9ec; --muted: #9aa2ac; --line: #2a2f36;
    --accent: #5b8ff0; --accent-ink: #0d1117; --accent-soft: #1d2a42;
    --red: #ef6b62; --red-soft: #3a1f1d; --amber: #e0a84a; --amber-soft: #352a17;
    --green: #5cc27f; --green-soft: #17301f; --grey: #6f7782;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #1a1d22; --ink: #e7e9ec; --muted: #9aa2ac; --line: #2a2f36;
  --accent: #5b8ff0; --accent-ink: #0d1117; --accent-soft: #1d2a42;
  --red: #ef6b62; --red-soft: #3a1f1d; --amber: #e0a84a; --amber-soft: #352a17;
  --green: #5cc27f; --green-soft: #17301f; --grey: #6f7782;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 2px; align-self: center; }
.theme button { font: 600 12px/1 "Segoe UI", system-ui, sans-serif; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.theme button:hover { color: var(--ink); }
.theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
header { display: flex; align-items: baseline; gap: 14px; padding: 18px 24px 8px; max-width: 1240px; margin: 0 auto; }
header h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
header .sum { color: var(--muted); }
header .ago { margin-left: auto; color: var(--muted); font-size: 12px; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; padding: 8px 24px 40px; max-width: 1240px; margin: 0 auto; }
@media (max-width: 880px) { .wrap { grid-template-columns: minmax(0, 1fr); padding: 8px 16px 32px; } header { padding: 16px 16px 8px; flex-wrap: wrap; row-gap: 6px; } header .ago { margin-left: 0; } }
main { min-width: 0; }
.steptext, .body, .run, .files div { overflow-wrap: anywhere; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 2px 8px; }
h2:first-child { margin-top: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px; }
.empty { color: var(--muted); padding: 22px 18px; text-align: center; }
.top { display: flex; gap: 10px; align-items: flex-start; }
.title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; }
.refnote { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
.swwrap { max-width: 1240px; margin: 4px auto 0; padding: 0 24px; }
@media (max-width: 880px) { .swwrap { padding: 0 16px; } }
.swstrip { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.swdot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.swdot.busy { background: var(--amber); }
.swdot.mine { background: var(--accent); }
.swbtns { margin-left: auto; }
.swbtns .b { padding: 6px 11px; }
.swstrip .msg { color: var(--red); font-size: 12px; width: 100%; }
.swstrip .msg:empty { display: none; }
.ref { display: inline-block; font: 600 12px/1 ui-monospace, Consolas, monospace; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 4px 6px; margin-right: 6px; vertical-align: 1px; }
.pill { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.pill.blocking { background: var(--red-soft); color: var(--red); }
.pill.later { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.body { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.body code, .opt code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--grey); margin-top: 2px; }
.opt.on .dot { border-color: var(--accent); background: radial-gradient(var(--accent) 0 4px, transparent 5px); }
.opt .lab { font-weight: 600; }
.opt .note { display: block; color: var(--muted); font-size: 13px; }
.rec { font-size: 11px; font-weight: 600; color: var(--green); background: var(--green-soft); border-radius: 99px; padding: 1px 8px; margin-left: 6px; }
textarea { width: 100%; min-height: 62px; resize: vertical; margin-top: 12px; padding: 9px 11px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
textarea:focus, .opt:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.acts { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.acts .msg { color: var(--red); font-size: 13px; }
.acts .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
button.b { font: 600 13px/1 inherit; font-family: inherit; border-radius: 7px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.b:hover { border-color: var(--accent); }
button.b.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.b.primary:hover { filter: brightness(1.06); }
button.b:disabled { opacity: .45; cursor: default; filter: none; border-color: var(--line); }
button.link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
.files { margin-top: 10px; display: grid; gap: 4px; font-size: 13px; }
.files code { font: 12.5px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.cfg { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.run { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }
.run.good { background: var(--green-soft); color: var(--green); }
.run.warn { background: var(--amber-soft); color: var(--amber); }
.run.bad { background: var(--red-soft); color: var(--red); }
.run .meta { font-weight: 400; display: inline; }
details.out { margin-top: 6px; font-size: 12px; color: var(--muted); }
details.out summary { cursor: pointer; }
details.out pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0 0; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--ink); }
.confirm { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--amber-soft); color: var(--ink); }
.confirm .acts { margin-top: 8px; }
.working { color: var(--amber); font-weight: 600; }
.hint.left { margin-left: 0; }
.stepbox { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.steptext { margin-top: 4px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.stepbox .acts { margin-top: 10px; }
.pdmact { margin-top: 10px; padding: 8px 10px; border-radius: 6px; border: 1px dashed var(--line); background: var(--panel); font-size: 13px; }
.pdmact .run { margin-top: 6px; }
.pdmfail { margin: 6px 0 0 18px; padding: 0; font-size: 13px; color: var(--red); }
.pdmsame { margin: 6px 0 0 18px; padding: 0; font-size: 13px; color: var(--amber); }
.pdmsame code, .pdmfail code { font: 12px ui-monospace, Consolas, monospace; color: var(--ink); }
.sent .row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.sent .row:first-child { border-top: 0; padding-top: 0; }
.sent .row:last-child { padding-bottom: 0; }
.sent .what { flex: 1; min-width: 0; }
.sent .ans { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.sess { display: grid; gap: 10px; }
.s { padding: 12px 14px; margin: 0; }
.s .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.s .state { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; margin-left: auto; }
.st-working { background: var(--green-soft); color: var(--green); }
.st-waiting { background: var(--amber-soft); color: var(--amber); }
.st-blocked { background: var(--red-soft); color: var(--red); }
.st-idle, .st-none { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.act { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
.act.working { color: var(--green); }
.act.working span:last-child { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sess > div { min-width: 0; }
aside { min-width: 0; }
.act.quiet { color: var(--muted); font-size: 12px; }
.act.needs { flex-direction: column; gap: 2px; background: var(--amber-soft); color: var(--amber); border-radius: 6px; padding: 6px 9px; }
.act.needs span { color: var(--ink); font-size: 12px; }
.card.s.needs-you { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--green); align-self: center; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.s .doing { margin-top: 4px; overflow-wrap: anywhere; }
.card.collapsed .more { display: none; }
.card:not(.collapsed) .line { display: none; }
.card .top { cursor: pointer; }
.card .line { margin-top: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.collapsed { padding-top: 12px; padding-bottom: 12px; }
#sessions { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
#sessions > div { border-top: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
#sessions > div:first-child { border-top: 0; }
#sessions > div:hover { background: var(--bg); }
.srow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sname { font-weight: 600; min-width: 46px; }
.srow .state { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; }
.st-needs { background: var(--amber-soft); color: var(--amber); }
.owned { font-size: 12px; color: var(--accent); }
.heard { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.sdetail { margin-top: 6px; font-size: 13px; }
.slive { margin-top: 4px; font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#history summary { cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 2px 8px; }
.notebox textarea { min-height: 44px; }
.s .wait { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.s .when { color: var(--muted); font-size: 12px; margin-top: 4px; }
.notebox textarea { margin-top: 0; }
.notes { margin-top: 10px; font-size: 13px; }
.notes div { color: var(--muted); padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
.banner { max-width: 1240px; margin: 8px auto 0; padding: 0 24px; }
.banner div { background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
.problems { color: var(--amber); font-size: 12px; margin-top: 6px; }
.gone { opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; }
</style>
</head>
<body>
<header>
  <h1>PDM Desk</h1>
  <span class="sum" id="sum"></span>
  <span class="ago" id="ago"></span>
  <span class="theme" id="theme" role="group" aria-label="Colours">
    <button data-t="light" title="Light">Light</button><button data-t="dark" title="Dark">Dark</button><button data-t="system" title="Follow Windows">System</button>
  </span>
</header>
<div class="banner" id="banner"></div>
<div class="swwrap"><div class="swstrip" id="swstrip"></div></div>
<div class="wrap">
  <main>
    <h2>Tickets</h2>
    <div id="tickets"></div>
    <div id="sentWrap"></div>
  </main>
  <aside>
    <h2>Sessions</h2>
    <div class="sess" id="sessions"></div>
    <h2>Note to Admin</h2>
    <div class="card notebox">
      <textarea id="note" placeholder="Anything for Admin. It's saved as a file Admin reads."></textarea>
      <div class="acts"><button class="b primary" id="noteSend" disabled>Send to Admin</button><span class="msg" id="noteMsg"></span></div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="problems" id="problems"></div>
  </aside>
</div>
<script>
const SESSIONS = ['admin', 'dev', 'sw', 'app'];
const NAMES = { admin: 'Admin', dev: 'Dev', sw: 'SW', app: 'App' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Plain text with **bold** and `code`; everything else is shown as typed.
const fmt = s => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
const name = s => NAMES[s] || (s ? s[0].toUpperCase() + s.slice(1) : '');
let state = null, lastSeen = 0, lastJson = '', pageVersion = null;
const busyHere = () => running.size > 0 || pdmRunning.size > 0 || [...document.querySelectorAll('textarea')].some(t => t.value.trim());
const drafts = {};          // ticket file -> { choice, note } while Grant is typing
const editing = new Set();  // answered tickets reopened with "Change answer"
const cards = new Map();    // ticket file -> { json, el }

function ago(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 50) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  const d = new Date(t);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
const when = iso => { const t = Date.parse(iso); return t ? new Date(t).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; };

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Desk': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'The Desk server said no (' + r.status + ').');
  return j;
}

async function load() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    const text = await r.text();
    lastSeen = Date.now();
    $('banner').innerHTML = '';
    if (text !== lastJson) {
      lastJson = text; state = JSON.parse(text);
      // A new Desk was installed: reload, unless Grant is typing or something is running.
      pageVersion ??= state.version;
      if (state.version && state.version !== pageVersion && !busyHere()) { location.reload(); return; }
      render();
    }
  } catch {
    $('banner').innerHTML = '<div>The Desk server isn\'t answering. Open PDM Desk from the Start menu to start it again.</div>';
  }
  $('ago').textContent = lastSeen ? 'Updated ' + new Date(lastSeen).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
}

const isOpen = t => ['open', 'started'].includes(t.status || 'open') || editing.has(t._file);
const rank = t => (t.priority === 'blocking' ? 0 : 1);

function render() {
  const tickets = state.tickets || [];
  const open = tickets.filter(isOpen).sort((a, b) => rank(a) - rank(b) || String(a.createdAt).localeCompare(String(b.createdAt)));
  const blocking = open.filter(t => t.priority === 'blocking').length;
  $('sum').textContent = open.length ? `${open.length} open${blocking ? ` · ${blocking} blocking` : ''}` : 'Nothing waiting for you';
  document.title = open.length ? `(${open.length}) PDM Desk` : 'PDM Desk';

  // Keyed cards: a card is rebuilt only when its file changed, so typing isn't disturbed.
  const box = $('tickets'), keep = new Set();
  if (!open.length) { box.innerHTML = '<div class="card empty">No open tickets. New ones appear here by themselves.</div>'; cards.clear(); }
  else {
    box.querySelector('.empty')?.remove();
    open.forEach(t => {
      const json = JSON.stringify(t) + editing.has(t._file);
      let c = cards.get(t._file);
      if (!c || c.json !== json) { const el = ticketCard(t); if (c) c.el.replaceWith(el); c = { json, el }; cards.set(t._file, c); }
      keep.add(t._file);
    });
    for (const [k, c] of cards) if (!keep.has(k)) { c.el.remove(); cards.delete(k); }
    open.forEach((t, i) => cards.get(t._file).el.classList.toggle('collapsed', !isExpanded(t, i)));
    // Move cards only when the order changed (moving a card would take the cursor out of its note).
    const want = open.map(t => cards.get(t._file).el);
    if (want.some((el, i) => box.children[i] !== el) || box.children.length !== want.length) want.forEach(el => box.appendChild(el));
  }

  // History: answered, done and dismissed, newest first, closed until opened.
  const sent = tickets.filter(t => !isOpen(t) && t.answeredAt).sort((a, b) => String(b.answeredAt).localeCompare(String(a.answeredAt))).slice(0, 40);
  const hist = sent.length ? `<details id="history"${historyOpen ? ' open' : ''}><summary>History (${sent.length})</summary><div class="card sent">` + sent.map(sentRow).join('') + '</div></details>' : '';
  if ($('sentWrap').dataset.h !== hist) {
    $('sentWrap').innerHTML = hist; $('sentWrap').dataset.h = hist;
    $('history')?.addEventListener('toggle', e => { historyOpen = e.target.open; });
  }

  swStrip();
  const status = state.status || [];
  const by = Object.fromEntries(status.map(s => [String(s.name || s._file).toLowerCase(), s]));
  const order = [...SESSIONS, ...Object.keys(by).filter(k => !SESSIONS.includes(k))];
  const acts = Object.fromEntries((state.activity || []).map(a => [String(a.name || a._file).toLowerCase(), a]));
  const needs = Object.keys(acts).filter(k => acts[k].activity === 'needs-you').map(name);
  if (needs.length) $('sum').textContent += ` · ${needs.join(', ')} ${needs.length === 1 ? 'needs' : 'need'} you`;
  const order2 = [...order, ...Object.keys(acts).filter(k => !order.includes(k))];
  drawSessions(order2, by, acts);

  $('notes').innerHTML = (state.notes || []).slice(0, 3).map(n => `<div>${esc(n.text)}<br><small>${when(n.createdAt)}${n.readAt ? ' · read by Admin' : ''}</small></div>`).join('');
  $('problems').innerHTML = (state.problems || []).map(p => 'Couldn\'t read ' + esc(p)).join('<br>');
}

// The ticket's ID first (SW5, A3 ...), as Admin and the sessions name it: the id's leading letters and number.
const shortId = t => { const id = String(t.id || t._file); const m = id.match(/^[A-Za-z]+\d+/); return m ? m[0] : id; };
const idChip = t => `<span class="ref">${esc(shortId(t))}</span>`;
const refNote = t => t.ref && t.ref !== shortId(t) ? ` <span class="refnote">${esc(t.ref)}</span>` : '';

// SOLIDWORKS strip: who has it (desk\sw\lock.json, written by SwCmd, a session's round or the Desk), or Free.
function swStrip() {
  const sw = state.sw || {}, l = sw.lock, box = $('swstrip');
  const other = l && l.holder && l.holder !== 'grant';
  let h;
  if (sw.pause && other) h = `<span class="swdot busy"></span><b>SOLIDWORKS:</b> waiting for ${esc(name(l.holder))} to reach a safe point…${l.purpose ? ` <span class="meta">(${esc(l.purpose)})</span>` : ''}
    <span class="swbtns"><button class="b" data-sw="handback" title="Cancel the pause">Cancel pause</button></span>`;
  else if (sw.pause || (l && l.holder === 'grant')) h = `<span class="swdot mine"></span><b>You have SOLIDWORKS</b>${l?.purpose ? ` <span class="meta">(${esc(l.purpose)})</span>` : ''}${(l?.since || sw.pause?.requestedAt) ? ` <span class="meta">since ${ago(l?.since || sw.pause.requestedAt)}</span>` : ''}
    <span class="swbtns"><button class="b primary" data-sw="handback" title="Let the sessions use SOLIDWORKS again">Hand back</button></span>`;
  else if (other) h = `<span class="swdot busy"></span><b>SOLIDWORKS:</b> ${esc(name(l.holder))}${l.purpose ? ' · ' + esc(l.purpose) : ''}${l.since ? ` <span class="meta">since ${ago(l.since)}</span>` : ''}
    <span class="swbtns"><button class="b" data-sw="pause" title="Ask the sessions to stop at a safe point and leave SOLIDWORKS to you">Pause automatic work</button></span>`;
  else h = `<span class="swdot"></span><b>SOLIDWORKS:</b> free
    <span class="swbtns"><button class="b" data-sw="pause" title="Keep the sessions out of SOLIDWORKS until you hand it back">Pause automatic work</button></span>`;
  h += '<span class="msg" id="swmsg"></span>';
  if (box.dataset.h !== h) { box.innerHTML = h; box.dataset.h = h; }
}
$('swstrip').onclick = async e => {
  const act = e.target?.dataset?.sw; if (!act) return;
  e.target.disabled = true;
  try { await post('/api/sw/' + act, {}); lastJson = ''; await load(); }
  catch (err) { e.target.disabled = false; const m = $('swmsg'); if (m) m.textContent = err.message; }
};

// Which open tickets show in full: the one at the top, any being worked on, and whatever Grant opened.
const expandPref = new Map();
let historyOpen = false;
function isExpanded(t, i) {
  if (expandPref.has(t._file)) return expandPref.get(t._file);
  return i === 0 || editing.has(t._file) || running.has(t._file) || pdmRunning.has(t._file) || t.status === 'started';
}
const firstLine = s => String(s || '').split('\n').map(x => x.trim()).find(Boolean) || '';

function ticketCard(t) {
  const el = document.createElement('div');
  el.className = 'card';
  const type = t.type || 'decision';
  const pill = type === 'info' ? '<span class="pill info">Info</span>' : `<span class="pill ${t.priority === 'blocking' ? 'blocking' : 'later'}">${t.priority === 'blocking' ? 'Blocking' : 'Later'}</span>`;
  const from = [t.owner ? 'from ' + name(t.owner) : '', ago(t.createdAt)].filter(Boolean).join(' · ');
  let html = `<div class="top"><div class="title">${idChip(t)}${esc(t.title || t._file)}${refNote(t)}</div>${pill}</div>
    <div class="meta">${esc(from)}</div>${t.body ? `<div class="body">${fmt(t.body)}</div>` : ''}`;
  if (type === 'decision') {
    const d = drafts[t._file] ??= editing.has(t._file) && t.answer ? { choice: t.answer.choice || '', note: t.answer.note || '' } : { choice: '', note: '' };
    const opts = t.options || [];
    html += opts.length ? '<div class="opts">' + opts.map(o => `<button type="button" class="opt${d.choice === o.key ? ' on' : ''}" data-key="${esc(o.key)}" role="radio" aria-checked="${d.choice === o.key}">
        <span class="dot"></span><span><span class="lab">${esc(o.label || o.key)}</span>${o.key === t.recommended ? '<span class="rec">Recommended</span>' : ''}${o.note ? `<span class="note">${fmt(o.note)}</span>` : ''}</span></button>`).join('') + '</div>' : '';
    html += `<textarea placeholder="${opts.length ? 'Note (optional)' : 'Your answer'}">${esc(d.note)}</textarea>
      <div class="acts">${t.recommended && opts.some(o => o.key === t.recommended) ? '<button class="b" data-act="rec">Accept recommendation</button>' : ''}
      <button class="b primary" data-act="send">Send</button>${editing.has(t._file) ? '<button class="b" data-act="cancel">Cancel</button>' : ''}<span class="msg"></span><span class="hint">Ctrl+Enter sends</span></div>`;
  } else if (type === 'info') {
    html += '<div class="acts"><button class="b" data-act="dismiss">Dismiss</button><span class="msg"></span></div>';
  } else if (type === 'sw-job') {
    html += swJob(t);
  }
  el.innerHTML = html;
  // Everything below the header goes in .more; collapsed, the card shows one line of context instead.
  const meta = el.querySelector(':scope > .meta'), more = document.createElement('div');
  more.className = 'more';
  while (meta && meta.nextSibling) more.appendChild(meta.nextSibling);
  el.appendChild(more);
  const line = document.createElement('div');
  line.className = 'line'; line.textContent = firstLine(t.body);
  meta?.after(line);
  el.querySelector(':scope > .top').addEventListener('click', e => {
    if (e.target.closest('button, a, input, textarea')) return;
    const now = el.classList.toggle('collapsed'); expandPref.set(t._file, !now);
  });
  if (type === 'sw-job') wireJob(el, t); else wire(el, t);
  return el;
}

// ---- SOLIDWORKS jobs: Start (close all without saving, open the files), steps one at a time, Done / Problem.
const running = new Set();
function swJob(t) {
  const d = drafts[t._file] ??= { confirm: false, problem: false, note: '' };
  const files = t.files || [], steps = t.steps || [], n = Math.min(Math.max(+t.step || 0, 0), Math.max(steps.length - 1, 0));
  const reopened = editing.has(t._file), started = t.status === 'started', busy = running.has(t._file);
  let h = files.length ? '<div class="files">' + files.map(f => `<div><code>${esc(f.path)}</code>${f.configuration ? ` <span class="cfg">${esc(f.configuration)}</span>` : ''}</div>`).join('') + '</div>' : '';
  if (t.run) {
    const cls = !t.run.ok ? 'bad' : t.run.problems ? 'warn' : 'good';
    h += `<div class="run ${cls}">${esc(t.run.message || '')} <span class="meta">${when(t.run.at)}</span></div>`;
    if (t.run.output) h += `<details class="out"><summary>Details</summary><pre>${esc(t.run.output)}</pre></details>`;
  }
  if (!reopened) {
    const what = t.closeAll === false ? 'Opens the files in SOLIDWORKS; nothing is closed.' : 'Closes everything in SOLIDWORKS <b>without saving</b>, then opens the files.';
    if (busy) h += '<div class="acts"><span class="working">Working in SOLIDWORKS… this can take a few minutes.</span></div>';
    else if (d.confirm) h += `<div class="confirm">${t.closeAll === false ? 'Open the files now?' : 'Close all documents in SOLIDWORKS without saving? Unsaved changes are lost.'}
      <div class="acts"><button class="b primary" data-act="go">${t.closeAll === false ? 'Yes, open' : 'Yes, close all and open'}</button><button class="b" data-act="nogo">Cancel</button></div></div>`;
    else if (files.length) h += `<div class="acts"><button class="b ${started ? '' : 'primary'}" data-act="start">${started ? 'Start again' : 'Start'}</button><span class="hint left">${what}</span></div>`;
    if (steps.length) {
      const st = steps[n], act = typeof st === 'object' && st ? st.action : null;
      const done = act ? (t.actions || {})[n] : null, pdmBusy = pdmRunning.has(t._file);
      const lastStep = n >= steps.length - 1;
      h += `<div class="stepbox"><div class="meta">Step ${n + 1} of ${steps.length}</div><div class="steptext">${fmt(stepText(st))}</div>`;
      if (act) h += actionBox(act, done, lastStep);
      if (act && d.confirmCheckin) h += `<div class="confirm">Check in ${(act.paths || []).length} file(s) to the vault as you, with the note "${esc(act.note || '')}"?
        <div class="acts"><button class="b primary" data-act="checkin-go">Yes, check in</button><button class="b" data-act="checkin-no">Cancel</button></div></div>`;
      else if (pdmBusy) h += '<div class="acts"><span class="working">Working in PDM…</span></div>';
      else {
        const runLabel = act && !done?.ok ? (lastStep ? 'Run: ' : 'Next: ') + ACTION_VERB[act.type] : 'Next';
        const showNext = steps.length > 1 || (act && !done?.ok);
        h += showNext ? `<div class="acts">${steps.length > 1 ? `<button class="b" data-act="back" ${n === 0 || busy ? 'disabled' : ''}>Back</button>` : ''}
          <button class="b${act && !done?.ok ? ' primary' : ''}" data-act="next" ${(lastStep && !(act && !done?.ok)) || busy ? 'disabled' : ''}>${esc(runLabel)}</button></div>` : '';
      }
      h += '</div>';
    }
  }
  const last = !steps.length || n >= steps.length - 1 || reopened;
  h += `<textarea placeholder="Note for ${esc(name(t.owner) || 'the owner')} (optional with Done; with Problem, say what's wrong)">${esc(d.note)}</textarea>
    <div class="acts"><button class="b ${last ? 'primary' : ''}" data-act="done" ${busy ? 'disabled' : ''}>Done</button><button class="b" data-act="problem" ${busy ? 'disabled' : ''}>Problem</button>${reopened ? '<button class="b" data-act="cancel">Cancel</button>' : ''}<span class="msg"></span></div>`;
  return h;
}

// A step is text, or { text, action: { type, paths, note } } that the PDM app runs on Next.
const stepText = s => typeof s === 'object' && s ? s.text || '' : String(s ?? '');
const ACTION_VERB = { 'download-latest': 'download latest', 'check-out': 'check out', 'check-in': 'check in' };
const pdmRunning = new Set();
function actionBox(act, done, lastStep) {
  const files = act.paths || [];
  const fileList = files.map(p => esc(String(p).split(/[\\/]/).pop())).join(', ');
  let h = `<div class="pdmact"><div><b>${lastStep ? 'Run' : 'When you press Next'}:</b> ${esc(ACTION_VERB[act.type] || act.type)} ${files.length} file${files.length === 1 ? '' : 's'} in PDM: ${fileList}${act.note ? ` <span class="meta">(note: ${esc(act.note)})</span>` : ''}</div>`;
  if (done) {
    const same = (done.files || []).filter(f => f.ok && f.nothingNew);
    const allSame = done.ok && same.length && same.length === (done.files || []).length;
    h += `<div class="run ${done.ok ? (allSame ? 'warn' : 'good') : 'bad'}">${done.ok ? (allSame ? 'Already in the vault (nothing new to upload)' : 'Done in PDM') : 'Not done'}${done.by ? ' as ' + esc(done.by) : ''} <span class="meta">${when(done.at)}</span></div>`;
    if (done.ok && same.length && !allSame) h += '<ul class="pdmsame">' + same.map(f => `<li><code>${esc(String(f.path).split('/').pop())}</code>: already in the vault (nothing new to upload)</li>`).join('') + '</ul>';
    const bad = (done.files || []).filter(f => !f.ok);
    if (bad.length) h += '<ul class="pdmfail">' + bad.map(f => `<li><code>${esc(String(f.path).split('/').pop())}</code>: ${esc(f.why)}${f.log ? ` <span class="meta">(${esc(f.log)})</span>` : ''}</li>`).join('') + '</ul>';
    if ((done.log || []).length) h += `<details class="out"><summary>PDM's report</summary><pre>${esc(done.log.join('\n'))}</pre></details>`;
  }
  return h + '</div>';
}

function redraw(t) {
  const c = cards.get(t._file); if (!c) return;
  const el = ticketCard(t); c.el.replaceWith(el); c.el = el;
}

function wireJob(el, t) {
  const d = drafts[t._file], msg = el.querySelector('.msg');
  const on = (act, f) => { const b = el.querySelector(`[data-act="${act}"]`); if (b) b.onclick = f; };
  const fail = e => { const m = cards.get(t._file)?.el.querySelector('.msg'); if (m) m.textContent = e.message; };
  const finish = async (choice) => {
    el.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      await post('/api/sw/finish', { id: t._file, choice, note: d.note });
      delete drafts[t._file]; editing.delete(t._file);
      el.classList.add('gone'); setTimeout(() => { lastJson = ''; load(); }, 250);
    } catch (e) { msg.textContent = e.message; el.querySelectorAll('button').forEach(b => b.disabled = false); }
  };
  on('start', () => { d.confirm = true; redraw(t); });
  on('nogo', () => { d.confirm = false; redraw(t); });
  on('go', async () => {
    d.confirm = false; running.add(t._file); redraw(t);
    try { await post('/api/sw/start', { id: t._file, confirmed: true }); }
    catch (e) { running.delete(t._file); redraw(t); fail(e); return; }
    running.delete(t._file);
    const c = cards.get(t._file); if (c) { c.el.remove(); cards.delete(t._file); } // rebuilt from the updated ticket
    lastJson = ''; load();
  });
  const step = async to => {
    try { await post('/api/sw/step', { id: t._file, step: to }); lastJson = ''; load(); } catch (e) { msg.textContent = e.message; }
  };
  on('back', () => step((+t.step || 0) - 1));
  const runAction = async confirmed => {
    d.confirmCheckin = false; pdmRunning.add(t._file); redraw(t);
    let err = null;
    try { await post('/api/sw/action', { id: t._file, step: +t.step || 0, confirmed }); } catch (e) { err = e; }
    pdmRunning.delete(t._file);
    const c = cards.get(t._file); if (c) { c.el.remove(); cards.delete(t._file); }
    lastJson = ''; await load();
    if (err) { const m = cards.get(t._file)?.el.querySelector('.msg'); if (m) m.textContent = err.message; }
  };
  on('next', () => {
    const n = +t.step || 0, st = (t.steps || [])[n], act = typeof st === 'object' && st ? st.action : null;
    if (act && !(t.actions || {})[n]?.ok) {
      if (act.type === 'check-in') { d.confirmCheckin = true; redraw(t); return; }
      return runAction(false);
    }
    step(n + 1);
  });
  on('checkin-go', () => runAction(true));
  on('checkin-no', () => { d.confirmCheckin = false; redraw(t); });
  on('done', () => finish('done'));
  on('problem', () => { if (!d.note.trim()) { msg.textContent = 'Type what the problem is in the note, then press Problem.'; el.querySelector('textarea')?.focus(); return; } finish('problem'); });
  on('cancel', () => { editing.delete(t._file); delete drafts[t._file]; lastJson = ''; load(); });
  const ta = el.querySelector('textarea');
  if (ta) ta.oninput = () => { d.note = ta.value; };
}

function wire(el, t) {
  const msg = el.querySelector('.msg'), ta = el.querySelector('textarea'), send = el.querySelector('[data-act="send"]');
  const d = drafts[t._file];
  const sync = () => { if (send) send.disabled = !(d.choice || d.note.trim()); };
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    d.choice = d.choice === b.dataset.key ? '' : b.dataset.key;
    el.querySelectorAll('.opt').forEach(x => { const on = x.dataset.key === d.choice; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
    sync();
  });
  if (ta) {
    ta.oninput = () => { d.note = ta.value; sync(); };
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !send.disabled) send.click(); };
  }
  sync();
  const act = async (path, body, btn) => {
    el.querySelectorAll('button').forEach(b => b.disabled = true); msg.textContent = '';
    try {
      await post(path, body);
      delete drafts[t._file]; editing.delete(t._file);
      el.classList.add('gone'); setTimeout(() => { lastJson = ''; load(); }, 250);
    } catch (e) { msg.textContent = e.message; el.querySelectorAll('button').forEach(b => b.disabled = false); sync(); }
  };
  if (send) send.onclick = () => act('/api/answer', { id: t._file, choice: d.choice, note: d.note });
  const rec = el.querySelector('[data-act="rec"]');
  if (rec) rec.onclick = () => act('/api/answer', { id: t._file, choice: t.recommended, note: d.note });
  const dis = el.querySelector('[data-act="dismiss"]');
  if (dis) dis.onclick = () => act('/api/dismiss', { id: t._file });
  const cancel = el.querySelector('[data-act="cancel"]');
  if (cancel) cancel.onclick = () => { editing.delete(t._file); delete drafts[t._file]; lastJson = ''; load(); };
}

function sentRow(t) {
  let ans = '';
  if (t.type === 'info') ans = 'Dismissed';
  else if (t.type === 'sw-job' && t.answer) ans = (t.answer.choice === 'problem' ? 'Problem: ' + esc(t.answer.note) : 'Done' + (t.answer.note ? ' · ' + esc(t.answer.note) : ''));
  else if (t.answer) {
    const o = (t.options || []).find(o => o.key === t.answer.choice);
    ans = [o ? (o.label || o.key) : t.answer.choice, t.answer.note].filter(Boolean).map(esc).join(' · ');
  }
  const done = t.status === 'done' ? ` · done by ${esc(name(t.owner) || 'owner')}` : '';
  const change = t.type === 'decision' || t.type === 'sw-job' ? ` · <button class="link" data-change="${esc(t._file)}">Change answer</button>` : '';
  return `<div class="row"><div class="what"><div>${idChip(t)}${esc(t.title || t._file)}${refNote(t)}</div>
    <div class="ans">${ans}</div><div class="meta">${when(t.answeredAt)}${done}${change}</div></div></div>`;
}

// Live activity from each session's hooks (desk\activity\<role>.json): working (with what), idle, or needs-you.
// Working with no update for 3 minutes is shown as probably idle (a long command can be silent).
function activityLine(k, a) {
  if (!a) return '';
  const age = (Date.now() - Date.parse(a.at)) / 1000;
  if (a.activity === 'needs-you') return `<div class="act needs"><b>Needs you in the ${esc(name(k))} window</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ''}</div>`;
  if (a.activity === 'working' && age < 180) return `<div class="act working"><span class="pulse" aria-hidden="true"></span><span>${esc(a.detail || 'Working')}</span></div>`;
  if (a.activity === 'working') return `<div class="act quiet">Probably idle · last activity ${ago(a.at)}</div>`;
  return `<div class="act quiet">Idle · ${ago(a.at)}</div>`;
}

const sessionHtml = {}, sessionOpen = new Set();
function drawSessions(order, by, acts) {
  const box = $('sessions');
  order.forEach((k, i) => {
    const html = sessionCard(k, by[k], acts[k], ownedOpen(k));
    let el = box.children[i];
    if (!el || el.dataset.k !== k) { el = document.createElement('div'); el.dataset.k = k; box.insertBefore(el, box.children[i] || null); }
    if (sessionHtml[k] !== html) { el.innerHTML = html; sessionHtml[k] = html; } // unchanged rows keep their pulse running
    el.onclick = () => { sessionOpen.has(k) ? sessionOpen.delete(k) : sessionOpen.add(k); render(); };
  });
  while (box.children.length > order.length) box.lastChild.remove();
}

const ownedOpen = k => (state.tickets || []).filter(t => isOpen(t) && String(t.owner || '').toLowerCase() === k).length;

// One row per session: name, state, its open tickets, when it was last heard from; click for details.
function sessionCard(k, s, a, owned) {
  // The pill is live activity (the hooks' desk\activity files); the status file is detail.
  // A running tool stays "Running" however long it takes; otherwise 3 minutes quiet means "probably idle".
  // A background job fires no hooks, so a status file saying working/blocked in the last 10 minutes counts as working too.
  const age = a ? (Date.now() - Date.parse(a.at)) / 1000 : Infinity;
  const stAge = s?.updatedAt ? (Date.now() - Date.parse(s.updatedAt)) / 1000 : Infinity;
  const background = ['working', 'blocked'].includes(String(s?.state || '').toLowerCase()) && stAge < 600;
  let pill, cls, live = '';
  if (a?.activity === 'needs-you') [pill, cls] = ['Needs you', 'needs'];
  else if (a?.running) { [pill, cls] = ['Running', 'working']; live = `Running ${dur(age)}: ${a.detail || 'a tool'}`; }
  else if (background) { [pill, cls] = ['Working (background)', 'working']; live = s.doing || ''; }
  else if (a?.activity === 'working' && age < 180) { [pill, cls] = ['Working', 'working']; live = a.detail || ''; }
  else if (a?.activity === 'working') [pill, cls] = ['Probably idle', 'idle'];
  else [pill, cls] = ['Idle', 'idle'];
  const heard = [a?.at, s?.updatedAt].filter(Boolean).sort().pop();
  const openRow = sessionOpen.has(k);
  let h = `<div class="srow s-${cls}${openRow ? ' open' : ''}" title="Click for details">
    <span class="sname">${esc(name(s?.name || k))}</span>
    <span class="state st-${cls}">${cls === 'working' ? '<span class="pulse" aria-hidden="true"></span>' : ''}${pill}</span>
    ${owned ? `<span class="owned" title="Open tickets from ${esc(name(k))}">${owned} ticket${owned === 1 ? '' : 's'}</span>` : ''}
    <span class="heard">${heard ? ago(heard) : 'not heard from'}</span></div>`;
  if (live) h += `<div class="slive">${esc(live)}</div>`;
  if (a?.activity === 'needs-you') h += `<div class="act needs"><b>Needs you in the ${esc(name(k))} window</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ''}</div>`;
  if (openRow) {
    const st = s?.state ? String(s.state) : '';
    h += `<div class="sdetail">${st ? `<div class="wait">Stage: ${esc(st[0].toUpperCase() + st.slice(1))}${s.updatedAt ? ' · ' + ago(s.updatedAt) : ''}</div>` : ''}
      ${s?.doing && live !== s.doing ? `<div class="doing">${esc(s.doing)}</div>` : ''}${s?.waitingOn ? `<div class="wait">Waiting on: ${esc(s.waitingOn)}</div>` : ''}
      ${a && !live ? `<div class="wait">Latest: ${esc(a.detail || a.activity)} · ${ago(a.at)}</div>` : ''}${!s && !a ? '<div class="wait">No status yet.</div>' : ''}</div>`;
  }
  return h;
}
const dur = sec => sec < 60 ? 'under a minute' : sec < 3600 ? Math.round(sec / 60) + ' min' : Math.floor(sec / 3600) + ' h ' + Math.round(sec % 3600 / 60) + ' min';

$('sentWrap').onclick = e => {
  const id = e.target?.dataset?.change; if (!id) return;
  editing.add(id); delete drafts[id]; lastJson = ''; load(); window.scrollTo({ top: 0, behavior: 'smooth' });
};

const note = $('note'), noteSend = $('noteSend');
note.oninput = () => { noteSend.disabled = !note.value.trim(); $('noteMsg').textContent = ''; };
note.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !noteSend.disabled) noteSend.click(); };
noteSend.onclick = async () => {
  noteSend.disabled = true;
  try { await post('/api/note', { text: note.value }); note.value = ''; $('noteMsg').textContent = ''; lastJson = ''; load(); }
  catch (e) { $('noteMsg').textContent = e.message; noteSend.disabled = false; }
};

function theme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { if (t === 'light' || t === 'dark') localStorage.setItem('desk-theme', t); else localStorage.removeItem('desk-theme'); } catch {}
  const now = document.documentElement.dataset.theme || 'system';
  document.querySelectorAll('#theme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === now));
}
$('theme').onclick = e => { if (e.target.dataset.t) theme(e.target.dataset.t); };
theme(document.documentElement.dataset.theme || 'system');

load();
setInterval(load, 3000);
setInterval(() => { if (state) render(); }, 60000); // keeps "5 min ago" current on the session cards
</script>
</body>
</html>
