<script>
// Light / dark / system, remembered on this PC; set before the page draws so it doesn't flash.

.card.heldgone { opacity: .45; pointer-events: none; }
.gone { opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; }
/* Three columns (Grant, 28 Nov): a narrow ticket list, the one ticket being worked on, a tight sessions panel. */
.wrap.desk3 { grid-template-columns: 230px minmax(0, 1fr) 270px; max-width: 1600px; gap: 16px; }
header, .swwrap, .banner, .boardwrap { max-width: 1600px; }
@media (max-width: 1100px) { .wrap.desk3 { grid-template-columns: 200px minmax(0, 1fr); } .wrap.desk3 > aside { grid-column: 1 / -1; } }
@media (max-width: 640px) { .wrap.desk3 { grid-template-columns: minmax(0, 1fr); } }
#listCol { min-width: 0; overflow-x: hidden; position: sticky; top: 8px; align-self: start; max-height: calc(100vh - 16px); overflow-y: auto; }
#listItems { display: grid; gap: 4px; }
.li { min-width: 0; display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font: 600 14px/1.2 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; cursor: pointer; }
.li:hover { border-color: var(--accent); }
.li.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.li { flex-wrap: wrap; row-gap: 2px; }
.li .num { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .own { font: 400 11px/1 "Segoe UI", system-ui, sans-serif; color: var(--muted); }
.li .ttl { flex-basis: 100%; padding-left: 15px; font: 400 12px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lhead { font-size: 12px; font-weight: 600; color: var(--ink); margin: 6px 2px 4px; }
.lhead.owner { color: var(--muted); margin-top: 14px; }
.lhead small { font-weight: 400; }
.lnone { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 8px; }
.li.unseen .num::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }
.li.talk { color: var(--muted); font-weight: 400; }
.ldot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--grey); }
.ldot.blocking { background: var(--red); } .ldot.gate { background: var(--amber); } .ldot.draft { background: #7c5cd6; } .ldot.info { background: transparent; border: 2px solid var(--grey); width: 5px; height: 5px; }
.ldot.talk { background: transparent; border: 2px solid var(--muted); width: 5px; height: 5px; }
.lempty { color: var(--muted); font-size: 12px; padding: 6px 2px; }
.lsep { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 2px 2px; }
#listCol #snoozed summary { margin: 10px 2px 4px; font-size: 12px; }
#listCol #snoozed .row { display: block; padding: 6px 4px; font-size: 12px; }
#listCol #snoozed .row .b { margin-top: 4px; padding: 3px 8px; font-size: 12px; }
#listCol .filterbar { font-size: 12px; margin: 0 2px 6px; }
.desk3 main .card { margin-bottom: 12px; }
.mkwrap { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.mktabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; align-items: center; }
.mktabs button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.mktabs button.on { border-color: var(--accent); color: var(--accent); }
.mktabs .sp { flex: 1; }
.mkwrap .pmk-bar { position: sticky; top: 0; }
.mkwrap .pmk-pages { max-height: 78vh; overflow: auto; }
/* Sessions: one line each; the state is the name's colour, details in the tooltip or a click. */
#sessions > div { padding: 6px 10px; }
.srow2 { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.srow2 .sname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sname.c-working { color: var(--green, #1f8a4c); } .sname.c-waiting { color: var(--amber); } .sname.c-blocked, .sname.c-needs { color: var(--red); } .sname.c-idle, .sname.c-none { color: var(--muted); font-weight: 500; }
.tk { font: 600 12px/1 "Segoe UI", system-ui, sans-serif; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 10px; padding: 3px 7px; cursor: pointer; }
.tk.on { box-shadow: inset 0 0 0 1px var(--accent); }
.srow2 .pulse { display: inline-block; margin-right: 5px; vertical-align: middle; }
.sage { color: var(--muted); font-size: 12px; min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>{{deskName}}</h1>
  <span class="sum" id="sum"></span>
  <span class="ago" id="ago"></span>
  <button class="b notif" id="notif" aria-pressed="false" title="A sound and a desktop notice when a blocking ticket arrives or a session needs you (only while a Desk tab is open)">Notices: off</button>
  <span class="theme" id="theme" role="group" aria-label="Colours">
    <button data-t="light" title="Light">Light</button><button data-t="dark" title="Dark">Dark</button><button data-t="system" title="Follow Windows">System</button>
  </span>
</header>
<div class="banner" id="banner"></div>
<div class="banner lag" id="lag"></div>
<div class="swwrap"><div class="swstrip" id="swstrip"></div></div>
<div class="wrap desk3">
  <nav id="listCol" aria-label="Tickets">
    <h2>Tickets</h2>
    <div id="filterWrap"></div>
    <div id="listItems"></div>
    <div id="snoozeWrap"></div>
  </nav>
  <main>
    <div id="reviewWrap"></div>
    <div id="heldWrap"></div>
    <div id="tickets"></div>
    <div id="sentWrap"></div>
  </main>
  <aside>
    <h2>Sessions</h2>
    <div class="sess" id="sessions"></div>
    <h2>Note to Admin</h2>
    <div class="card notebox">
      <textarea id="note" placeholder="Anything for Admin. It's saved as a file Admin reads."></textarea>
      <div class="acts"><button class="b primary" id="noteSend" disabled>Send to Admin</button><span class="msg" id="noteMsg"></span></div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="problems" id="problems"></div>
  </aside>
</div>
<div class="boardwrap" id="boardWrap"></div>
<script src="/markup.js"></script>
<script>
const DESK_NAME = {{deskNameJs}}; // filled in by the server from settings (deskName)
// Sessions, their labels and groups come from settings (state.desk.groups); see readGroups().
let LABELS = {}, CONF = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Plain text with **bold** and `code`; everything else is shown as typed.
const fmt = s => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
// Ticket text as markdown (Grant, 28 Nov): paragraphs, - and 1. lists, **bold**, *italic*, `code`, ``` blocks, # headings
// and | tables |. Everything is escaped first; only these few tags are made, so a ticket can't put its own HTML here.
function inl(s) {
  const codes = [];
  let h = esc(s).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*\n]*?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function md(text) {
  const lines = String(text ?? '').replace(/\r/g, '').split('\n'), out = [];
  const isRow = l => /^\s*\|.*\|\s*$/.test(l), isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inl(c.trim()));
  const item = l => l.match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
  let para = [];
  const flush = () => { if (para.length) out.push('<p>' + para.join('<br>') + '</p>'); para = []; };
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      flush(); const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push('<pre>' + esc(code.join('\n')) + '</pre>'); continue;
    }
    if (isRow(l) && i + 1 < lines.length && isSep(lines[i + 1])) {
      flush(); const head = cells(l), rows = []; i += 2;
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push('<table><tr>' + head.map(c => '<th>' + c + '</th>').join('') + '</tr>'
        + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table>');
      continue;
    }
    const hm = l.match(/^\s*#{1,4}\s+(.*)$/);
    if (hm) { flush(); out.push('<div class="h">' + inl(hm[1]) + '</div>'); i++; continue; }
    const m = item(l);
    if (m) {
      flush(); const ordered = /\d/.test(m[2]), items = [];
      while (i < lines.length) {
        const x = item(lines[i]);
        if (x && /\d/.test(x[2]) === ordered) { items.push(inl(x[3])); i++; continue; }
        if (!x && /^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length - 1] += '<br>' + inl(lines[i].trim()); i++; continue; }
        break;
      }
      out.push((ordered ? '<ol>' : '<ul>') + items.map(x => '<li>' + x + '</li>').join('') + (ordered ? '</ol>' : '</ul>'));
      continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(inl(l)); i++;
  }
  flush();
  return '<div class="md">' + out.join('') + '</div>';
}
// A ticket's attachments (any type of ticket): an image shows small and opens full size; a PDF or other file is a button.
// The Desk serves each by ticket id and key, only from its fileRoots folders; one it can't serve says why.
function attachHtml(t) {
  const list = (t.attachments || []).filter(a => a && a.key);
  if (!list.length) return '';
  return '<div class="attach">' + list.map(a => {
    const url = `/api/attachment?id=${encodeURIComponent(t._file)}&key=${encodeURIComponent(a.key)}`, label = esc(a.label || a.key);
    if (a.ok === false) return `<span class="missing">${label}: not available (${esc(a.why || 'file not found')})</span>`;
    // "mark up here": the in-browser commenting tool (markup.js), for anyone away from this PC's PDF app (28 Nov).
    const mk = `<a class="small" href="/markup?id=${encodeURIComponent(t._file)}&key=${encodeURIComponent(a.key)}" target="_blank" rel="noopener">mark up here</a>`;
    if (a.kind === 'image') return `<span class="pdfatt"><a href="${url}" target="_blank" rel="noopener" title="${label}"><img src="${url}" alt="${label}" loading="lazy"></a>${mk}</span>`;
    // A PDF opens in this PC's PDF app (to mark up and save in place); the browser view is a small link beside it.
    if (a.kind === 'pdf') return `<span class="pdfatt"><button class="b" data-open="${esc(a.key)}" data-id="${esc(t._file)}" title="Opens the file itself in your PDF app; save your mark-up there">${label} (PDF)</button>`
      + `${a.markedUp ? `<span class="pill marked" title="Saved ${esc(when(a.savedAt))}">marked up</span>` : ''}`
      + `<a class="small" href="${url}" target="_blank" rel="noopener">view in browser</a>${mk}<span class="msg"></span></span>`;
    return `<a class="b" href="${url}" target="_blank" rel="noopener">${label}</a>`;
  }).join('') + '</div>';
}
const name = s => LABELS[String(s ?? '').toLowerCase()] || (s ? s[0].toUpperCase() + s.slice(1) : '');
function readGroups() {
  LABELS = {}; CONF = {};
  for (const g of state.desk?.groups || []) for (const x of g?.sessions || []) {
    const id = String(x?.id || '').toLowerCase(); if (!id) continue;
    LABELS[id] = x.label || x.id; CONF[id] = x;
  }
}
let state = null, lastSeen = 0, lastJson = '', pageVersion = null;
const busyHere = () => running.size > 0 || pdmRunning.size > 0 || [...document.querySelectorAll('textarea')].some(t => t.value.trim()) || !!(typeof mk !== 'undefined' && mk && mk.unsaved() > 0);
const drafts = {};          // ticket file -> { choice, note } while Grant is typing
const editing = new Set();  // answered tickets reopened with "Change answer"
const cards = new Map();    // ticket file -> { json, el }
// Grant is typing: a note with text anywhere on the page (or something running), or the cursor in a ticket's box.
const holding = () => busyHere() || !!document.activeElement?.matches?.('#tickets textarea, #tickets input');
// The card he's typing in: the cursor is in it, or one of its boxes has text.
const typingIn = el => { const a = document.activeElement; return (!!a && el.contains(a) && a.matches('textarea, input')) || [...el.querySelectorAll('textarea, input.code')].some(x => x.value.trim()); };
const hasText = k => !!String(drafts[k]?.note || '').trim();
let showNew = false, frozen = false; // "Show" pressed on the new-tickets bar; the last render held the list still

function ago(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 50) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  const d = new Date(t);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
const when = iso => { const t = Date.parse(iso); return t ? new Date(t).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; };

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Desk': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'The Desk server said no (' + r.status + ').');
  return j;
}

async function load() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    const text = await r.text();
    lastSeen = Date.now();
    $('banner').innerHTML = '';
    if (text !== lastJson) {
      lastJson = text; state = JSON.parse(text);
      // A new Desk was installed: reload, unless Grant is typing or something is running.
      pageVersion ??= state.version;
      if (state.version && state.version !== pageVersion && !holding()) { location.reload(); return; }
      render();
      notices();
    } else if (frozen && !holding()) render(); // Grant has finished typing: the held changes and new tickets go in now
    else if (nextWake && Date.now() >= nextWake) render(); // a snoozed ticket's time is up
  } catch {
    $('banner').innerHTML = `<div>The ${esc(DESK_NAME)} server isn't answering. Start it again from the Start menu (PDM Sessions).</div>`;
  }
  $('ago').textContent = lastSeen ? 'Updated ' + new Date(lastSeen).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
}

const isOpen = t => ['open', 'started', 'discuss'].includes(t.status || 'open') || editing.has(t._file);
// A discussion waiting on the owner's reply isn't waiting on Grant: it goes last and isn't counted as open.
const lastPost = t => (t.thread || []).at(-1);
const awaitingOwner = t => t.status === 'discuss' && lastPost(t)?.from === 'grant' && !editing.has(t._file);
const rank = t => (awaitingOwner(t) ? 2 : t.priority === 'blocking' ? 0 : 1);
// Snoozed (Grant, 28 Nov): out of the list and the counts until snoozedUntil, then back as it was. nextWake: when the
// earliest one comes back, so the page redraws then even if nothing else changed.
const snoozed = t => !!t.snoozedUntil && Date.parse(t.snoozedUntil) > Date.now() && !editing.has(t._file);
let nextWake = 0, snoozeOpen = false;

function render() {
  readGroups();
  lagLine();
  const tickets = state.tickets || [];
  const asleep = tickets.filter(t => isOpen(t) && snoozed(t)).sort((a, b) => String(a.snoozedUntil).localeCompare(String(b.snoozedUntil)));
  nextWake = asleep.length ? Date.parse(asleep[0].snoozedUntil) : 0;
  const open = tickets.filter(t => isOpen(t) && !snoozed(t)).sort((a, b) => rank(a) - rank(b) || String(a.createdAt).localeCompare(String(b.createdAt)));
  const mine = open.filter(t => !awaitingOwner(t)), talking = open.length - mine.length;
  const blocking = mine.filter(t => t.priority === 'blocking').length;
  $('sum').textContent = (mine.length ? `${mine.length} open${blocking ? ` · ${blocking} blocking` : ''}` : 'Nothing waiting for you')
    + (talking ? ` · ${talking} in discussion` : '') + (asleep.length ? ` · ${asleep.length} snoozed` : '');
  document.title = mine.length ? `(${mine.length}) ${DESK_NAME}` : DESK_NAME;

  // The draft Review screen (/review): one draft at a time with the PDF large. The button shows while any wait for Grant.
  const nReview = tickets.filter(t => t.type === 'draft-review' && waitingDraft(t) && !awaitingOwner(t) && !snoozed(t)).length;
  const rv = nReview ? `<a class="bigreview" href="/review">Review drafts <span>(${nReview} waiting)</span></a>` : '';
  if ($('reviewWrap').dataset.h !== rv) { $('reviewWrap').innerHTML = rv; $('reviewWrap').dataset.h = rv; }

  // A screen chip, or a session's ticket count on the right, filters the list; clicking it again (or Show all) clears it.
  const fl = [screenFilter && `<b>${esc(screenFilter)}</b>`, ownerFilter && `from <b>${esc(name(ownerFilter))}</b>`].filter(Boolean);
  if (screenFilter) open.splice(0, open.length, ...open.filter(t => String(t.screen || '') === screenFilter));
  if (ownerFilter) open.splice(0, open.length, ...open.filter(t => String(t.owner || '').toLowerCase() === ownerFilter));
  const fb = fl.length ? `<div class="filterbar">Only ${fl.join(' ')} (${open.length}) <button class="link" data-clearfilter="1">Show all</button></div>` : '';
  if ($('filterWrap').dataset.h !== fb) { $('filterWrap').innerHTML = fb; $('filterWrap').dataset.h = fb; }

  // Draft reviews stay together under their batch, at the place of the batch's first draft; drafts in a batch by PartNo.
  const grouped = [], seenBatch = new Set();
  for (const t of open) {
    if (t.type !== 'draft-review') { grouped.push(t); continue; }
    const b = String(t.batch ?? ''); if (seenBatch.has(b)) continue; seenBatch.add(b);
    open.filter(x => x.type === 'draft-review' && String(x.batch ?? '') === b)
      .sort((x, y) => String(x.partNo || x._file).localeCompare(String(y.partNo || y._file))).forEach(x => grouped.push(x));
  }
  open.splice(0, open.length, ...grouped);
  // Three columns (Grant, 28 Nov): the list on the left only ever gains or loses a row; the middle shows the one ticket
  // picked and is never moved, closed or redrawn by a refresh while he's typing in it or has unsaved mark-ups.
  // With the owner (Grant, 28 Nov): discussions waiting on the owner, and answers the owner hasn't marked done yet, sit
  // greyed at the foot of the list and never open by themselves; the middle moves on to what needs him.
  const parked = tickets.filter(t => t.status === 'answered' && !editing.has(t._file) && !snoozed(t)
      && (!screenFilter || String(t.screen || '') === screenFilter) && (!ownerFilter || String(t.owner || '').toLowerCase() === ownerFilter))
    .sort((a, b) => String(b.answeredAt).localeCompare(String(a.answeredAt)));
  const listAll = [...open, ...parked];
  drawList(listAll);
  drawMiddle(listAll, tickets);
  frozen = false;
  heldBar([]);

  // Snoozed tickets: listed under the open ones, closed until opened, each with when it comes back and Wake now.
  const sz = asleep.length ? `<details id="snoozed"${snoozeOpen ? ' open' : ''}><summary>Snoozed (${asleep.length})</summary><div class="card">`
    + asleep.map(t => `<div class="row"><span class="t">${esc(shortId(t))} ${esc(t.title || t._file)}</span><span class="meta">back ${esc(when(t.snoozedUntil))}</span>`
      + `<button class="b" data-wake="${esc(t._file)}">Wake now</button></div>`).join('') + '</div></details>' : '';
  if ($('snoozeWrap').dataset.h !== sz) {
    $('snoozeWrap').innerHTML = sz; $('snoozeWrap').dataset.h = sz;
    $('snoozed')?.addEventListener('toggle', e => { snoozeOpen = e.target.open; });
  }

  // History: answered, done and dismissed, newest first, closed until opened.
  const sent = tickets.filter(t => !isOpen(t) && t.answeredAt).sort((a, b) => String(b.answeredAt).localeCompare(String(a.answeredAt))).slice(0, 40);
  const hist = sent.length ? `<details id="history"${historyOpen ? ' open' : ''}><summary>History (${sent.length})</summary><div class="card sent">` + sent.map(sentRow).join('') + '</div></details>' : '';
  if ($('sentWrap').dataset.h !== hist) {
    $('sentWrap').innerHTML = hist; $('sentWrap').dataset.h = hist;
    $('history')?.addEventListener('toggle', e => { historyOpen = e.target.open; });
  }

  swStrip();
  const status = state.status || [];
  const by = Object.fromEntries(status.map(s => [String(s.name || s._file).toLowerCase(), s]));
  const acts = Object.fromEntries((state.activity || []).map(a => [String(a.name || a._file).toLowerCase(), a]));
  const needs = Object.keys(acts).filter(k => acts[k].activity === 'needs-you').map(name);
  if (needs.length) $('sum').textContent += ` · ${needs.join(', ')} ${needs.length === 1 ? 'needs' : 'need'} you`;
  // Each group's sessions in settings order (a heading per group when settings set the groups); any other session with a
  // status or activity file goes last, under "Other". Nothing is hidden.
  const rows = [], listed = new Set(), heads = !!state.desk?.grouped;
  for (const g of state.desk?.groups || []) {
    if (heads) rows.push({ head: String(g?.name || '') });
    for (const x of g?.sessions || []) { const k = String(x?.id || '').toLowerCase(); if (k && !listed.has(k)) { listed.add(k); rows.push(k); } }
  }
  const others = [...Object.keys(by), ...Object.keys(acts)].filter((k, i, a) => a.indexOf(k) === i && !listed.has(k));
  if (others.length && heads) rows.push({ head: 'Other' });
  rows.push(...others);
  drawSessions(rows, by, acts);

  $('notes').innerHTML = (state.notes || []).slice(0, 3).map(n => `<div>${esc(n.text)}<br><small>${when(n.createdAt)}${n.readAt ? ' · read by Admin' : ''}</small></div>`).join('');
  $('problems').innerHTML = [...(state.problems || []).map(p => 'Couldn\'t read ' + esc(p)), ...(state.warnings || []).map(esc)].join('<br>');
}

  let h = `<div class="gateinfo">${esc(g?.label || t.gate || 'Gate')} for <b>${esc(t.screen || '?')}</b> · asked at pin <span title="${esc(t.pin)} UTC">${esc(short(t.pin) || t.pin || '?')}</span></div>`;
  if (steelChanged(t)) h += `<div class="gatewarn">The steel has changed since this was asked (steel now from ${esc(short(steelOf(t.screen)))}).</div>`;
  h += attachHtml(t);
  h += threadHtml(t);

  const discuss = { key: DISCUSS, label: (t.thread || []).length ? 'Reply' : "Other, let's discuss", note: `Your comment goes to ${name(t.owner) || 'the owner'}, who replies here.` };
  let opts;

  h += '<div class="opts">' + opts.map(o => `<button type="button" class="opt${o.key === DISCUSS ? ' discuss' : ''}${on(o) ? ' on' : ''}" data-key="${esc(o.key)}"${o.code !== undefined ? ` data-code="${esc(o.code)}"` : ''} role="radio" aria-checked="${on(o)}">
      <span class="dot"></span><span><span class="lab">${esc(o.label || o.key)}</span>${o.key === t.recommended ? '<span class="rec">Recommended</span>' : ''}${o.note ? `<span class="note">${fmt(o.note)}</span>` : ''}</span></button>`).join('') + '</div>';
  if (g.input === 'code' && !(g.codes || []).length && d.choice === 'code') h += `<input class="code" type="number" min="0" step="1" inputmode="numeric" placeholder="Code" value="${esc(d.code)}">`;
  const out = gateOutcome(t, d);
  h += `<textarea placeholder="${d.choice === DISCUSS ? 'Your comment' : out?.noteRequired ? 'Note (needed: say why)' : 'Note (optional)'}">${esc(d.note)}</textarea>`;
  if (d.confirm) h += `<div class="confirm">The steel has changed since this was asked (asked at ${esc(short(t.pin))}; steel now from ${esc(short(steelOf(t.screen)))}). Send "${esc(out?.label || '')}" anyway?
    <div class="acts"><button class="b primary" data-act="gate-go">Yes, send</button><button class="b" data-act="gate-no">Cancel</button></div></div>`;
  h += `<div class="acts">${t.recommended && opts.some(o => o.key === t.recommended && o.key !== DISCUSS) ? '<button class="b" data-act="rec">Accept recommendation</button>' : ''}
    <button class="b primary" data-act="send">Send</button>${editing.has(t._file) ? '<button class="b" data-act="cancel">Cancel</button>' : ''}<span class="msg"></span><span class="hint">Your answer goes on the ticket; ${esc(name(t.owner) || 'the owner')} updates the register</span></div>`;
  return h;
}
function wireGate(el, t) {
  const d = drafts[t._file], msg = el.querySelector('.msg'), ta = el.querySelector('textarea'), send = el.querySelector('[data-act="send"]');
  if (!send) return;
  const sync = () => {
    const out = gateOutcome(t, d);
    send.disabled = d.choice === DISCUSS ? !d.note.trim() : !out || (out.noteRequired && !d.note.trim());
    send.textContent = d.choice === DISCUSS ? 'Send comment' : 'Send';
  };
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const same = d.choice === b.dataset.key && (b.dataset.code === undefined || String(d.code) === b.dataset.code);
    d.choice = same ? '' : b.dataset.key;
    if (b.dataset.code !== undefined) d.code = same ? '' : b.dataset.code;
    d.confirm = false; redraw(t);
    const c = cards.get(t._file)?.el; (c?.querySelector('input.code') || (d.choice === DISCUSS ? c?.querySelector('textarea') : null))?.focus();
  });
  const code = el.querySelector('input.code');
  if (code) code.oninput = () => { d.code = code.value; sync(); };
  if (ta) { ta.oninput = () => { d.note = ta.value; sync(); }; ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !send.disabled) send.click(); }; }
  sync();
  const go = async (path, body) => {
    el.querySelectorAll('button').forEach(b => b.disabled = true); msg.textContent = '';
    try {
      await post(path, body);
      delete drafts[t._file]; editing.delete(t._file);
      el.classList.add('gone'); setTimeout(() => { lastJson = ''; load(); loadBoard(); }, 250);
    } catch (e) {
      if (/steel has changed/i.test(e.message)) { d.confirm = true; redraw(t); return; }
      msg.textContent = e.message; el.querySelectorAll('button').forEach(b => b.disabled = false); sync();
    }
  };
  const answer = confirmed => go('/api/gate', { id: t._file, choice: d.choice, code: d.choice === 'code' ? Number(d.code) : undefined, note: d.note, confirmed });
  send.onclick = () => {
    if (d.choice === DISCUSS) return go('/api/discuss', { id: t._file, text: d.note });
    const out = gateOutcome(t, d);
    if (out && out.passes !== false && steelChanged(t)) { d.confirm = true; redraw(t); return; }
    answer(false);
  };
  const on = (k, f) => { const b = el.querySelector(`[data-act="${k}"]`); if (b) b.onclick = f; };
  on('gate-go', () => answer(true));
  on('gate-no', () => { d.confirm = false; redraw(t); });
  on('rec', () => { d.choice = t.recommended; send.onclick(); });
  on('cancel', () => { editing.delete(t._file); delete drafts[t._file]; lastJson = ''; load(); });
}

// ---- SOLIDWORKS jobs: Start (close all without saving, open the files), steps one at a time, Done / Problem.
const running = new Set();
function swJob(t) {

  const files = t.files || [], steps = t.steps || [], n = Math.min(Math.max(+t.step || 0, 0), Math.max(steps.length - 1, 0));
  const reopened = editing.has(t._file), started = t.status === 'started', busy = running.has(t._file);
  let h = files.length ? '<div class="files">' + files.map(f => `<div><code>${esc(f.path)}</code>${f.configuration ? ` <span class="cfg">${esc(f.configuration)}</span>` : ''}</div>`).join('') + '</div>' : '';
  if (t.run) {
    const cls = !t.run.ok ? 'bad' : t.run.problems ? 'warn' : 'good';
    h += `<div class="run ${cls}">${esc(t.run.message || '')} <span class="meta">${when(t.run.at)}</span></div>`;
    if (t.run.output) h += `<details class="out"><summary>Details</summary><pre>${esc(t.run.output)}</pre></details>`;
  }
  if (!reopened) {
    const what = t.closeAll === false ? 'Opens the files in SOLIDWORKS; nothing is closed.' : 'Closes everything in SOLIDWORKS <b>without saving</b>, then opens the files.';
    if (busy) h += '<div class="acts"><span class="working">Working in SOLIDWORKS… this can take a few minutes.</span></div>';
    else if (d.confirm) h += `<div class="confirm">${t.closeAll === false ? 'Open the files now?' : 'Close all documents in SOLIDWORKS without saving? Unsaved changes are lost.'}
      <div class="acts"><button class="b primary" data-act="go">${t.closeAll === false ? 'Yes, open' : 'Yes, close all and open'}</button><button class="b" data-act="nogo">Cancel</button></div></div>`;
    else if (files.length) h += `<div class="acts"><button class="b ${started ? '' : 'primary'}" data-act="start">${started ? 'Start again' : 'Start'}</button><span class="hint left">${what}</span></div>`;
    if (steps.length) {
      const st = steps[n], act = typeof st === 'object' && st ? st.action : null;
      const done = act ? (t.actions || {})[n] : null, pdmBusy = pdmRunning.has(t._file);
      const lastStep = n >= steps.length - 1;
      h += `<div class="stepbox"><div class="meta">Step ${n + 1} of ${steps.length}</div><div class="steptext">${md(stepText(st))}</div>`;
      if (act) h += actionBox(act, done, lastStep);
      if (act && d.confirmCheckin) h += `<div class="confirm">Check in ${(act.paths || []).length} file(s) to the vault as you, with the note "${esc(act.note || '')}"?
        <div class="acts"><button class="b primary" data-act="checkin-go">Yes, check in</button><button class="b" data-act="checkin-no">Cancel</button></div></div>`;
      else if (pdmBusy) h += '<div class="acts"><span class="working">Working in PDM…</span></div>';
      else {
        const runLabel = act && !done?.ok ? (lastStep ? 'Run: ' : 'Next: ') + ACTION_VERB[act.type] : 'Next';
        const showNext = steps.length > 1 || (act && !done?.ok);
        h += showNext ? `<div class="acts">${steps.length > 1 ? `<button class="b" data-act="back" ${n === 0 || busy ? 'disabled' : ''}>Back</button>` : ''}
          <button class="b${act && !done?.ok ? ' primary' : ''}" data-act="next" ${(lastStep && !(act && !done?.ok)) || busy ? 'disabled' : ''}>${esc(runLabel)}</button></div>` : '';
      }
      h += '</div>';
    }
  }
  const last = !steps.length || n >= steps.length - 1 || reopened;
  h += `<textarea placeholder="Note for ${esc(name(t.owner) || 'the owner')} (optional with Done; with Problem, say what's wrong)">${esc(d.note)}</textarea>
    <div class="acts"><button class="b ${last ? 'primary' : ''}" data-act="done" ${busy ? 'disabled' : ''}>Done</button><button class="b" data-act="problem" ${busy ? 'disabled' : ''}>Problem</button>${reopened ? '<button class="b" data-act="cancel">Cancel</button>' : ''}<span class="msg"></span></div>`;
  return h;
}

// A step is text, or { text, action: { type, paths, note } } that the PDM app runs on Next.
const stepText = s => typeof s === 'object' && s ? s.text || '' : String(s ?? '');

const pdmRunning = new Set();
function actionBox(act, done, lastStep) {
  const files = act.paths || [];
  const fileList = files.map(p => esc(String(p).split(/[\\/]/).pop())).join(', ');
  let h = `<div class="pdmact"><div><b>${lastStep ? 'Run' : 'When you press Next'}:</b> ${esc(ACTION_VERB[act.type] || act.type)} ${files.length} file${files.length === 1 ? '' : 's'} in PDM: ${fileList}${act.note ? ` <span class="meta">(note: ${esc(act.note)})</span>` : ''}</div>`;
  if (done) {
    const same = (done.files || []).filter(f => f.ok && f.nothingNew);
    const allSame = done.ok && same.length && same.length === (done.files || []).length;
    h += `<div class="run ${done.ok ? (allSame ? 'warn' : 'good') : 'bad'}">${done.ok ? (allSame ? 'Already in the vault (nothing new to upload)' : 'Done in PDM') : 'Not done'}${done.by ? ' as ' + esc(done.by) : ''} <span class="meta">${when(done.at)}</span></div>`;
    if (done.ok && same.length && !allSame) h += '<ul class="pdmsame">' + same.map(f => `<li><code>${esc(String(f.path).split('/').pop())}</code>: already in the vault (nothing new to upload)</li>`).join('') + '</ul>';
    const bad = (done.files || []).filter(f => !f.ok);
    if (bad.length) h += '<ul class="pdmfail">' + bad.map(f => `<li><code>${esc(String(f.path).split('/').pop())}</code>: ${esc(f.why)}${f.log ? ` <span class="meta">(${esc(f.log)})</span>` : ''}</li>`).join('') + '</ul>';
    if ((done.log || []).length) h += `<details class="out"><summary>PDM's report</summary><pre>${esc(done.log.join('\n'))}</pre></details>`;

}

function redraw(t) {
  const c = cards.get(t._file); if (!c) return;
  const el = ticketCard(t); c.el.replaceWith(el); c.el = el;
}

function wireJob(el, t) {
  const d = drafts[t._file], msg = el.querySelector('.msg');
  const on = (act, f) => { const b = el.querySelector(`[data-act="${act}"]`); if (b) b.onclick = f; };
  const fail = e => { const m = cards.get(t._file)?.el.querySelector('.msg'); if (m) m.textContent = e.message; };
  const finish = async (choice) => {
    el.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      await post('/api/sw/finish', { id: t._file, choice, note: d.note });
      delete drafts[t._file]; editing.delete(t._file);
      el.classList.add('gone'); setTimeout(() => { lastJson = ''; load(); }, 250);
    } catch (e) { msg.textContent = e.message; el.querySelectorAll('button').forEach(b => b.disabled = false); }
  };
  on('start', () => { d.confirm = true; redraw(t); });
  on('nogo', () => { d.confirm = false; redraw(t); });
  on('go', async () => {
    d.confirm = false; running.add(t._file); redraw(t);
    try { await post('/api/sw/start', { id: t._file, confirmed: true }); }
    catch (e) { running.delete(t._file); redraw(t); fail(e); return; }
    running.delete(t._file);
    const c = cards.get(t._file); if (c) { c.el.remove(); cards.delete(t._file); } // rebuilt from the updated ticket
    lastJson = ''; load();
  });
  const step = async to => {
    try { await post('/api/sw/step', { id: t._file, step: to }); lastJson = ''; load(); } catch (e) { msg.textContent = e.message; }
  };
  on('back', () => step((+t.step || 0) - 1));
  const runAction = async confirmed => {
    d.confirmCheckin = false; pdmRunning.add(t._file); redraw(t);
    let err = null;
    try { await post('/api/sw/action', { id: t._file, step: +t.step || 0, confirmed }); } catch (e) { err = e; }
    pdmRunning.delete(t._file);
    const c = cards.get(t._file); if (c) { c.el.remove(); cards.delete(t._file); }
    lastJson = ''; await load();
    if (err) { const m = cards.get(t._file)?.el.querySelector('.msg'); if (m) m.textContent = err.message; }
  };
  on('next', () => {
    const n = +t.step || 0, st = (t.steps || [])[n], act = typeof st === 'object' && st ? st.action : null;
    if (act && !(t.actions || {})[n]?.ok) {

  on('cancel', () => { editing.delete(t._file); delete drafts[t._file]; lastJson = ''; load(); });
  const ta = el.querySelector('textarea');
  if (ta) ta.oninput = () => { d.note = ta.value; };
}

function wire(el, t) {

// ---- Draft reviews (Grant's D8): the PDF one click away, Draw's notes, the thread, then Accept / Review comments / Redo.

function wireDraft(el, t) {

  const btn = k => el.querySelector(`[data-act="${k}"]`);
  const sync = () => { const empty = !d.note.trim(); btn('comment').disabled = empty; btn('redo').disabled = empty; };
  if (ta) ta.oninput = () => { d.note = ta.value; sync(); };
  sync();
  const pdf = btn('pdf');
  if (pdf) pdf.onclick = () => { pdfShown.has(t._file) ? pdfShown.delete(t._file) : pdfShown.add(t._file); lastJson = ''; load(); };

    el.querySelectorAll('button').forEach(b => b.disabled = true); msg.textContent = '';
    try {

      el.classList.add('gone'); setTimeout(() => { lastJson = ''; load(); }, 250);

const inBatch = (b, tickets) => tickets.filter(t => t.type === 'draft-review' && String(t.batch ?? '') === b);
const waitingDraft = t => ['open', 'discuss'].includes(t.status || 'open');
function batchHead(b, tickets) {
  const all = inBatch(b, tickets), waiting = all.filter(waitingDraft).length;
  const accepted = all.filter(t => ['answered', 'done'].includes(t.status) && t.answer?.choice === 'accept').length;
  const redo = all.filter(t => ['answered', 'done'].includes(t.status) && t.answer?.choice === 'redo').length;
  const title = all.find(t => t.batchTitle)?.batchTitle || 'Batch ' + b;
  const counts = [`${waiting} open`, accepted ? `${accepted} accepted` : '', redo ? `${redo} being redone` : ''].filter(Boolean).join(' · ');
  const acts = !waiting ? '' : batchConfirm === b
    ? `<span>Accept all ${waiting} remaining draft${waiting === 1 ? '' : 's'} of this batch?</span><button class="b primary" data-batch-go="${esc(b)}">Yes, accept ${waiting}</button><button class="b" data-batch-no="1">Cancel</button>`
    : `<button class="b" data-batch="${esc(b)}">Accept all remaining (${waiting})</button>`;
  return `<span class="bt">${esc(title)}</span><span class="meta">${esc(counts)}</span><div class="acts">${acts}<span class="msg"></span></div>`;
}
function batchHeadEl(b, tickets) {
  const el = document.createElement('div');
  el.className = 'batchhead'; el.innerHTML = batchHead(b, tickets);
  el.onclick = async e => {
    const x = e.target.dataset || {};
    if (x.batch !== undefined) { batchConfirm = x.batch; render(); }
    else if (x.batchNo) { batchConfirm = null; render(); }
    else if (x.batchGo !== undefined) {
      el.querySelectorAll('button').forEach(b => b.disabled = true);

      catch (err) { el.querySelector('.msg').textContent = err.message; el.querySelectorAll('button').forEach(b => b.disabled = false); }
    }
  };
  return el;
}

// The ticket's discussion: Grant's comments and the owner's replies, oldest first.
const DISCUSS = '__discuss';
function threadHtml(t) {
  const th = t.thread || [];

  const last = th.at(-1), who = name(t.owner) || 'the owner';
  const state = t.status !== 'discuss' ? '' : last.from === 'grant' ? `<div class="tstate">Waiting for ${esc(who)} to reply</div>`
    : `<div class="tstate new">${esc(name(last.from))} replied. ${t.type === 'draft-review' ? 'Comment again, Accept or Redo.' : 'Reply again, or pick an option to decide.'}</div>`;
  return '<div class="thread">' + th.map(p => `<div class="post${p.from === 'grant' ? ' me' : ''}"><div class="pmeta">${esc(p.from === 'grant' ? 'You' : name(p.from))} · ${ago(p.at)}</div><div>${md(p.text || '')}</div></div>`).join('') + state + '</div>';

function sentRow(t) {
  let ans = '';
  if (t.type === 'info') ans = 'Dismissed';
  else if (t.type === 'sw-job' && t.answer) ans = (t.answer.choice === 'problem' ? 'Problem: ' + esc(t.answer.note) : 'Done' + (t.answer.note ? ' · ' + esc(t.answer.note) : ''));
  else if (t.type === 'draft-review' && t.answer) ans = `${t.answer.choice === 'redo' ? 'Redo' : 'Accepted'} (v${esc(t.version || 1)})${t.answer.note ? ' · ' + esc(t.answer.note) : ''}`;
  else if (t.type === 'gate' && t.answer) ans = [gateAnswer(t), t.answer.note].filter(Boolean).map(esc).join(' · ') + (t.answer.pin ? ` <span class="meta" style="display:inline">(asked at pin ${esc(short(t.answer.pin))})</span>` : '');
  else if (t.answer) {
    const o = (t.options || []).find(o => o.key === t.answer.choice);
    ans = [o ? (o.label || o.key) : t.answer.choice, t.answer.note].filter(Boolean).map(esc).join(' · ');
  }
  const done = t.status === 'done' ? ` · done by ${esc(name(t.owner) || 'owner')}` : '';
  const change = t.type === 'decision' || t.type === 'gate' || t.type === 'sw-job' || t.type === 'draft-review' ? ` · <button class="link" data-change="${esc(t._file)}">Change answer</button>` : '';
  const title = t.type === 'draft-review' ? [t.partNo, t.title].filter(Boolean).join(' · ') : t.title;
  const dec = t.decision ? ` · decision <b>${esc(t.decision)}</b>` : ''; // the decision this ticket produced
  return `<div class="row"><div class="what"><div>${idChip(t)}${scrChip(t)}${esc(title || t._file)}${refNote(t)}</div>
    <div class="ans">${ans}</div><div class="meta">${when(t.answeredAt)}${dec}${done}${change}</div></div></div>`;
}

// Live activity from each session's hooks (desk\activity\<role>.json): working (with what), idle, or needs-you.
// Working with no update for 3 minutes is shown as probably idle (a long command can be silent).
function activityLine(k, a) {
  if (!a) return '';
  const age = (Date.now() - Date.parse(a.at)) / 1000;
  if (a.activity === 'needs-you') return `<div class="act needs"><b>Needs you in the ${esc(name(k))} window</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ''}</div>`;
  if (a.activity === 'working' && age < 180) return `<div class="act working"><span class="pulse" aria-hidden="true"></span><span>${esc(a.detail || 'Working')}</span></div>`;
  if (a.activity === 'working') return `<div class="act quiet">Probably idle · last activity ${ago(a.at)}</div>`;
  return `<div class="act quiet">Idle · ${ago(a.at)}</div>`;
}

const sessionHtml = {}, sessionOpen = new Set();
function drawSessions(rows, by, acts) {
  const box = $('sessions');
  rows.forEach((row, i) => {
    const head = typeof row === 'object', k = head ? '\u0000group:' + row.head : row;
    const html = head ? esc(row.head) : sessionCard(k, by[k], acts[k], ownedOpen(k));
    let el = box.children[i];
    if (!el || el.dataset.k !== k) { el = document.createElement('div'); el.dataset.k = k; box.insertBefore(el, box.children[i] || null); }
    if (sessionHtml[k] !== html) { el.innerHTML = html; sessionHtml[k] = html; } // unchanged rows keep their pulse running
    if (head) { el.className = 'sgroup'; el.onclick = null; return; }
    el.onclick = () => { sessionOpen.has(k) ? sessionOpen.delete(k) : sessionOpen.add(k); render(); };
  });
  while (box.children.length > rows.length) box.lastChild.remove();
}

const ownedOpen = k => (state.tickets || []).filter(t => isOpen(t) && String(t.owner || '').toLowerCase() === k).length;

// One row per session: name, state, its open tickets, when it was last heard from; click for details.
function sessionCard(k, s, a, owned) {
  // The pill is live activity (the hooks' desk\activity files); the status file is detail.
  // A running tool stays "Running" however long it takes; otherwise 3 minutes quiet means "probably idle".
  // A background job fires no hooks, so a status file saying working/blocked in the last 10 minutes counts as working too.
  const age = a ? (Date.now() - Date.parse(a.at)) / 1000 : Infinity;
  const stAge = s?.updatedAt ? (Date.now() - Date.parse(s.updatedAt)) / 1000 : Infinity;
  const background = ['working', 'blocked'].includes(String(s?.state || '').toLowerCase()) && stAge < 600;
  const conf = CONF[k] || {};
  let pill, cls, live = '', heardText = '';
  // A session with no activity file (no hooks there yet): the pill is its status file's state, with its age.
  // One marked remote with no files at all is reached by messages only.
  // A status file written for the session by another one ("relayedBy", e.g. apex-admin for Revit (Fiona)) is its
  // only news: the pill is always the file's state, shown "via <session>" with the file's time.
  const relayed = s?.relayedBy ? String(s.relayedBy) : '';
  if (!a && !s && conf.remote) { [pill, cls] = ['Messages only', 'none']; heardText = conf.via ? `through ${name(conf.via)}` : ''; }
  else if (s && (relayed || !a)) {
    const st = String(s.state || '').toLowerCase();
    [pill, cls] = ({ working: ['Working', 'working'], waiting: ['Waiting', 'waiting'], blocked: ['Blocked', 'blocked'], idle: ['Idle', 'idle'] })[st]
      || [st ? st[0].toUpperCase() + st.slice(1) : 'Idle', 'idle'];
    heardText = (relayed ? `via ${name(relayed)} · ` : '') + (s.updatedAt ? (relayed ? '' : 'as of ') + ago(s.updatedAt) : 'no time on its status');
  }
  else if (a?.activity === 'needs-you') [pill, cls] = ['Needs you', 'needs'];
  else if (a?.running) { [pill, cls] = ['Running', 'working']; live = `Running ${dur(age)}: ${a.detail || 'a tool'}`; }
  else if (background) { [pill, cls] = ['Working (background)', 'working']; live = s.doing || ''; }
  else if (a?.activity === 'working' && age < 180) { [pill, cls] = ['Working', 'working']; live = a.detail || ''; }
  else if (a?.activity === 'working') [pill, cls] = ['Probably idle', 'idle'];
  else [pill, cls] = ['Idle', 'idle'];
  const heard = [a?.at, s?.updatedAt].filter(Boolean).sort().pop();
  const openRow = sessionOpen.has(k);
  // One line (Grant, 28 Nov): the name in its state's colour, its open tickets (click: only those on the left), a short age.
  // What it's doing is the tooltip, and the click-open details.
  const tip = [pill, live || s?.doing || '', s?.waitingOn ? 'Waiting on: ' + s.waitingOn : '', heardText].filter(Boolean).join(' · ');
  const ccls = { working: 'working', waiting: 'waiting', blocked: 'blocked', needs: 'needs', idle: 'idle', none: 'none' }[cls] || 'idle';
  let h = `<div class="srow2${openRow ? ' open' : ''}" title="${esc(tip)}">
    <span class="sname c-${ccls}">${cls === 'working' && a ? '<span class="pulse" aria-hidden="true"></span>' : ''}${esc(name(s?.name || k))}</span>
    ${owned ? `<button type="button" class="tk${ownerFilter === k ? ' on' : ''}" data-owner="${esc(k)}" title="${owned} open ticket${owned === 1 ? '' : 's'} from ${esc(name(k))}: show only these">`
      + `<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true" style="vertical-align:-1px"><path d="M1 1h10v2.5a1.5 1.5 0 0 0 0 3V9H1V6.5a1.5 1.5 0 0 0 0-3z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg> ${owned}</button>` : ''}
    <span class="sage">${heard ? shortAgo(heard) : conf.remote ? 'msg' : '–'}</span></div>`;
  if (a?.activity === 'needs-you') h += `<div class="act needs"><b>Needs you in the ${esc(name(k))} window</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ''}</div>`;
  if (openRow) {
    const st = s?.state ? String(s.state) : '';
    h += `<div class="sdetail">${st ? `<div class="wait">Stage: ${esc(st[0].toUpperCase() + st.slice(1))}${s.updatedAt ? ' · ' + ago(s.updatedAt) : ''}</div>` : ''}
      ${s?.doing && live !== s.doing ? `<div class="doing">${esc(s.doing)}</div>` : ''}${s?.waitingOn ? `<div class="wait">Waiting on: ${esc(s.waitingOn)}</div>` : ''}${s?.withOthers ? `<div class="wait">${esc(s.withOthers)}</div>` : ''}
      ${a && !live ? `<div class="wait">Latest: ${esc(a.detail || a.activity)} · ${ago(a.at)}</div>` : ''}${!s && !a ? '<div class="wait">No status yet.</div>' : ''}</div>`;
  }
  return h;
}
const shortAgo = iso => { const t = Date.parse(iso); if (!t) return ''; const m = Math.max(0, (Date.now() - t) / 60000); return m < 1 ? 'now' : m < 60 ? Math.round(m) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
const dur = sec => sec < 60 ? 'under a minute' : sec < 3600 ? Math.round(sec / 60) + ' min' : Math.floor(sec / 3600) + ' h ' + Math.round(sec % 3600 / 60) + ' min';

// A snoozed ticket's line on a card's failure: shown in the card's .msg if it has one.
function alertLine(el, text) { const m = el.querySelector('.msg'); if (m) m.textContent = text; }
// A PDF attachment's button: the Desk opens the file in this PC's PDF app.
document.addEventListener('click', async e => {
  const b = e.target.closest?.('[data-open]'); if (!b) return;
  const m = b.parentElement.querySelector('.msg'); if (m) m.textContent = '';
  b.disabled = true;
  try { await post('/api/open', { id: b.dataset.id, key: b.dataset.open }); }
  catch (err) { if (m) m.textContent = err.message; }
  finally { setTimeout(() => { b.disabled = false; }, 1500); }
});
$('snoozeWrap').onclick = async e => {
  const id = e.target?.dataset?.wake; if (!id) return;
  e.target.disabled = true;
  try { await post('/api/snooze', { id, hours: 0 }); expandPref.set(id, true); lastJson = ''; load(); }
  catch (err) { e.target.disabled = false; e.target.textContent = err.message; }
};

$('sentWrap').onclick = e => {
  const id = e.target?.dataset?.change; if (!id) return;
  editing.add(id); delete drafts[id]; lastJson = ''; load(); window.scrollTo({ top: 0, behavior: 'smooth' });
};

const note = $('note'), noteSend = $('noteSend');
note.oninput = () => { noteSend.disabled = !note.value.trim(); $('noteMsg').textContent = ''; };
note.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !noteSend.disabled) noteSend.click(); };
noteSend.onclick = async () => {
  noteSend.disabled = true;
  try { await post('/api/note', { text: note.value }); note.value = ''; $('noteMsg').textContent = ''; lastJson = ''; load(); }
  catch (e) { $('noteMsg').textContent = e.message; noteSend.disabled = false; }
};

// ---- The board (stage 2, item 5): where each screen type is up to, from the register (/api/board, every 10 s).
let board = null, boardJson = '', boardSel = null, notStartedOpen = false;
async function loadBoard() {
  try {
    const r = await fetch('/api/board', { cache: 'no-store' });
    if (!r.ok) return;
    const text = await r.text();
    if (text === boardJson) return;
    boardJson = text; board = JSON.parse(text); drawBoard();
    if (state) render(); // gate cards show whether the steel has changed since they were asked
  } catch {}
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const p2 = n => String(n).padStart(2, '0');
// A pin as a short local time, "22 Nov 18:36".
const short = iso => { const t = Date.parse(iso); if (!t) return ''; const d = new Date(t); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const WORDS = { done: 'Done', running: 'Running', waiting: 'Waiting', blocked: 'Blocked' };
function boardCell(r, s) {
  const c = (r.cells || {})[s.key], key = r.ls + '|' + s.key, sel = boardSel === key ? ' sel' : '';
  if (!c) return `<span class="bc none">–</span>`;
  const tip = esc([c.pin && 'Pin ' + c.pin + ' UTC', c.date, c.by, c.note].filter(Boolean).join(' · '));
  if (s.kind === 'pin') {
    if (c.state === '?') return `<span class="bc unk${sel}" data-cell="${esc(key)}" title="${tip}">?</span>`;
    const later = r.steelSince && Date.parse(r.steelSince) < Date.parse(r.pin);
    return `<span class="bc pin${sel}" data-cell="${esc(key)}" title="${tip}">${esc(short(r.pin)) || '–'}${later ? `<span class="when">same steel since ${esc(short(r.steelSince))}</span>` : ''}</span>`;
  }
  let cls, word;
  // A gate's ticket over the register's cell (stage 2, item 6), until apex-admin sets the ticket done.
  const g = c.gate;
  if (g) {
    const [gc, gw] = { waiting: ['gw', 'Waiting for you'], accepted: ['ga', 'Accepted, not yet in the register'],
      notAccepted: ['gn', 'Not accepted, not yet in the register'], given: ['gg', `${g.answer || 'Answered'}, not yet in the register`] }[g.overlay] || ['unk', '?'];
    const pinG = g.ticketPin ? `<span class="when">asked at ${esc(short(g.ticketPin))}</span>` : '';
    return `<span class="bc ${gc}${sel}" data-cell="${esc(key)}"${g.overlay === 'waiting' ? ` data-ticket="${esc(g.ticket)}"` : ''} title="${tip}${g.answer ? ' · ' + esc(g.answer) : ''}">${esc(gw)}${pinG}</span>`;
  }
  if (c.state === '?') [cls, word] = ['unk', '?'];
  else if (c.outOfDate) [cls, word] = ['ood', 'Out of date'];
  else if (c.state === 'not started') [cls, word] = ['none', '–'];
  else [cls, word] = [c.state, WORDS[c.state] || c.state];
  const pin = c.pin && c.state !== 'not started' ? (c.outOfDate ? `<s>${esc(short(c.pin))}</s>` : esc(short(c.pin))) : '';
  const mark = c.olderSteel ? '<span class="mark">given on older steel</span>' : '';
  return `<span class="bc ${cls}${sel}" data-cell="${esc(key)}" title="${tip}">${esc(word)}${pin ? `<span class="when">${pin}</span>` : ''}${mark}</span>`;
}
function drawBoard() {
  const box = $('boardWrap'), b = board;
  if (!b || !b.enabled) { box.innerHTML = ''; return; }
  const rule = new Set(b.dividers || []), steps = b.steps || [];
  let h = '<h2>Where things are up to</h2>';
  if ((b.rows || []).length) {
    h += '<div class="boardscroll"><table class="board"><thead><tr><th class="lsh">Screen type</th>'
      + steps.map(s => `<th${rule.has(s.key) ? ' class="rule"' : ''}>${esc(s.label)}</th>`).join('') + '</tr></thead><tbody>';
    for (const r of b.rows) {
      h += `<tr><th class="lsh"><div class="ls">${esc(r.ls)}</div><div class="desc">${esc(r.description)}</div>`
        + `${(r.vms || []).length ? `<div class="vms">${esc(r.vms.join(', '))}</div>` : ''}`
        + `${r.openTickets ? `<button class="link" data-screen="${esc(r.ls)}" title="Show only ${esc(r.ls)} tickets">${r.openTickets} ticket${r.openTickets === 1 ? '' : 's'}</button>` : ''}</th>`
        + steps.map(s => `<td${rule.has(s.key) ? ' class="rule"' : ''}>${boardCell(r, s)}</td>`).join('') + '</tr>';
    }
    h += '</tbody></table></div>';
  } else h += '<div class="card empty">No screen type has started yet.</div>';
  // The cell clicked: its full pin, date, who and note.
  const [sl, sk] = (boardSel || '').split('|'), sr = (b.rows || []).find(r => r.ls === sl), sc = sr?.cells?.[sk], ss = steps.find(s => s.key === sk);
  if (sc) h += `<div class="celldetail"><b>${esc(sl)} · ${esc(ss?.label || sk)}</b>: ${esc(sc.state === '?' ? "can't tell (see the lines below)" : sc.outOfDate ? 'out of date (' + sc.state + ')' : sc.state)}${sc.olderSteel ? ', given on older steel' : ''}${sc.gate ? ` · <b>on the Desk:</b> ${esc({ waiting: 'waiting for you', accepted: 'accepted', notAccepted: 'not accepted', given: 'answered' }[sc.gate.overlay] || '')}${sc.gate.answer ? ' (' + esc(sc.gate.answer) + ')' : ''}, ticket ${esc(sc.gate.ticket)}, not yet in the register` : ''}
    <div class="meta">${[sc.pin && 'pin ' + esc(sc.pin) + ' UTC', esc(sc.date), esc(sc.by)].filter(Boolean).join(' · ')}</div>${sc.note ? `<div>${esc(sc.note)}</div>` : ''}</div>`;
  const ns = b.notStarted || [];
  if (ns.length) h += `<details class="notstarted" id="notStarted"${notStartedOpen ? ' open' : ''}><summary>${ns.length} screen type${ns.length === 1 ? '' : 's'} not started</summary>`
    + `<div>${ns.map(n => `${esc(n.ls)}${n.description ? ' <span class="meta" style="display:inline">' + esc(n.description) + '</span>' : ''}`).join('<br>')}</div></details>`;
  if ((b.problems || []).length) h += '<div class="problems">' + b.problems.map(esc).join('<br>') + '</div>';
  box.innerHTML = h;
  $('notStarted')?.addEventListener('toggle', e => { notStartedOpen = e.target.open; });
}
$('boardWrap').addEventListener('click', e => {
  const c = e.target.closest('[data-cell]'); if (!c) return;
  if (c.dataset.ticket) { // "Waiting for you": open that ticket on the to-do list
    screenFilter = null; ownerFilter = null; pick(c.dataset.ticket);
    $('tickets').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  boardSel = boardSel === c.dataset.cell ? null : c.dataset.cell; drawBoard();
});

// ---- Notices (stage 2, item 7): one short sound and a desktop notice when a poll brings a blocking ticket waiting for
// Grant that wasn't there before, or a session turns to "Needs you". Not on the first load; ids already announced are
// kept on this PC, so a reload doesn't repeat them. Off until Grant presses the button once (the click browsers need
// before they allow sound; it also asks for the notice permission). Works only while a Desk tab is open.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let noticesOn = store.get('desk-notices', false) === true, audio = null, firstPoll = true;
const announced = new Set(store.get('desk-announced', []));
function noticeButton() { const b = $('notif'); b.textContent = 'Notices: ' + (noticesOn ? 'on' : 'off'); b.setAttribute('aria-pressed', noticesOn); }
$('notif').onclick = async () => {
  noticesOn = !noticesOn; store.set('desk-notices', noticesOn); noticeButton();
  if (!noticesOn) return;
  try { audio ??= new AudioContext(); await audio.resume(); } catch {}
  try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch {}
  beep();
};
function beep() {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.3);
  } catch {}
}
function notify(key, text) {
  if (!noticesOn) return;
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const n = new Notification(DESK_NAME, { body: text, tag: key });
      n.onclick = () => { window.focus(); n.close(); };
    }
  } catch {}
}
function notices() {
  const fresh = [];
  for (const t of state.tickets || [])
    if (isOpen(t) && !awaitingOwner(t) && !editing.has(t._file) && !snoozed(t) && t.priority === 'blocking') {
      const key = 't:' + t._file;
      if (!announced.has(key)) { announced.add(key); fresh.push([key, [shortId(t), t.screen, t.title].filter(Boolean).join(' · ')]); }
    }
  for (const a of state.activity || [])
    if (a.activity === 'needs-you') {
      const k = String(a.name || a._file).toLowerCase(), key = 'n:' + k + ':' + (a.at || '');
      if (!announced.has(key)) { announced.add(key); fresh.push([key, `${name(k)} needs you${a.detail ? ': ' + a.detail : ''}`]); }
    }
  if (fresh.length) store.set('desk-announced', [...announced].slice(-500));
  if (firstPoll) { firstPoll = false; return; } // what was already there when the page opened isn't news
  if (!fresh.length || !noticesOn) return;
  beep();
  fresh.forEach(([key, text]) => notify(key, text));
}
noticeButton();

function theme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { if (t === 'light' || t === 'dark') localStorage.setItem('desk-theme', t); else localStorage.removeItem('desk-theme'); } catch {}
  const now = document.documentElement.dataset.theme || 'system';
  document.querySelectorAll('#theme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === now));
}
$('theme').onclick = e => { if (e.target.dataset.t) theme(e.target.dataset.t); };
theme(document.documentElement.dataset.theme || 'system');

load();
setInterval(load, 3000);
loadBoard();
setInterval(loadBoard, 10000);
setInterval(() => { if (state) render(); }, 60000); // keeps "5 min ago" current on the session cards
</script>
